<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Deep Space Inc.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#0a0a1a">
</head>
<body>
  <!-- Splash / Loading Screen (Section 73) -->
  <div id="splash-screen">
    <div id="splash-content">
      <div id="splash-logo">
        <div id="splash-rocket">&#128640;</div>
        <div id="splash-title">DEEP SPACE INC.</div>
        <div id="splash-subtitle">Build. Launch. Explore.</div>
      </div>
      <div id="splash-loading-bar-outer">
        <div id="splash-loading-bar-inner"></div>
      </div>
      <div id="splash-loading-text">Initializing systems...</div>
      <div id="splash-stars"></div>
    </div>
  </div>

  <div id="game-container" role="application" aria-label="Deep Space Inc. — Incremental Space Game">
    <!-- Top Bar -->
    <div id="top-bar" role="banner">
      <button id="menu-btn" class="icon-btn" title="Menu" aria-label="Open menu">&#9776;</button>
      <span id="phase-name" role="heading" aria-level="1" aria-live="polite">PHASE 1: THE JUNKYARD</span>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Open settings">&#9881;</button>
    </div>

    <!-- Currency Bar -->
    <div id="currency-bar" role="status" aria-label="Resources" aria-live="off"></div>

    <!-- Scene Area (Section 68: parallax scene zone) -->
    <div id="scene-area" role="img" aria-label="Game scene">
      <canvas id="scene-canvas" aria-hidden="true"></canvas>
      <div id="scene-parallax-bg" class="parallax-layer" aria-hidden="true"></div>
      <div id="scene-parallax-mid" class="parallax-layer" aria-hidden="true"></div>
      <div id="scene-parallax-fg" class="parallax-layer" aria-hidden="true"></div>
      <div id="rocket-assembly"></div>
      <div id="floating-numbers" aria-hidden="true"></div>
      <!-- Combo Counter -->
      <div id="combo-display" class="hidden">
        <div id="combo-count"></div>
        <div id="combo-label"></div>
        <div id="combo-mult"></div>
      </div>
      <!-- Weather Indicator -->
      <div id="weather-indicator" class="hidden">
        <span id="weather-name"></span>
      </div>
      <!-- Lucky Drop -->
      <div id="lucky-drop" class="hidden"></div>
      <!-- Golden Rush Banner -->
      <div id="golden-rush-banner" class="hidden">
        <span id="golden-rush-text">GOLDEN RUSH!</span>
      </div>
      <!-- Idle Streak Display -->
      <div id="idle-streak-display" class="hidden"></div>
      <!-- Active Boosters HUD -->
      <div id="active-boosters-hud" class="hidden"></div>
      <!-- Tap Button (Section 81: thumb-zone optimized) -->
      <button id="tap-btn" aria-label="Tap to earn resources">
        <span id="tap-icon" aria-hidden="true">&#128295;</span>
        <span id="tap-label">SCAVENGE</span>
        <span id="auto-tap-badge" class="hidden" aria-label="Auto-tap active">AUTO</span>
      </button>
    </div>

    <!-- Next Unlock Teaser -->
    <div id="next-unlock-bar" class="hidden">
      <div id="next-unlock-info"></div>
      <div id="next-unlock-progress-outer"><div id="next-unlock-progress-inner"></div></div>
    </div>

    <!-- Main Content Area -->
    <div id="main-content" role="main">
      <!-- Buy Amount Toggle -->
      <div id="buy-toggle" role="radiogroup" aria-label="Purchase quantity">
        <button class="buy-amt active" data-amount="1" role="radio" aria-checked="true">&times;1</button>
        <button class="buy-amt" data-amount="10" role="radio" aria-checked="false">&times;10</button>
        <button class="buy-amt" data-amount="100" role="radio" aria-checked="false">&times;100</button>
        <button class="buy-amt" data-amount="max" role="radio" aria-checked="false">MAX</button>
      </div>

      <!-- Tab Panels -->
      <div id="tab-content">
        <div id="panel-generators" class="tab-panel active" role="tabpanel" aria-labelledby="tab-generators"></div>
        <div id="panel-upgrades" class="tab-panel" role="tabpanel" aria-labelledby="tab-upgrades"></div>
        <div id="panel-zones" class="tab-panel" role="tabpanel" aria-labelledby="tab-zones"></div>
        <div id="panel-crew" class="tab-panel" role="tabpanel" aria-labelledby="tab-crew"></div>
        <div id="panel-fleet" class="tab-panel" role="tabpanel" aria-labelledby="tab-fleet"></div>
        <div id="panel-research" class="tab-panel" role="tabpanel" aria-labelledby="tab-research"></div>
        <div id="panel-collection" class="tab-panel" role="tabpanel" aria-labelledby="tab-collection"></div>
        <div id="panel-contracts" class="tab-panel" role="tabpanel" aria-labelledby="tab-contracts"></div>
        <div id="panel-boosters" class="tab-panel" role="tabpanel" aria-labelledby="tab-boosters"></div>
        <div id="panel-synergies" class="tab-panel" role="tabpanel" aria-labelledby="tab-synergies"></div>
        <div id="panel-skins" class="tab-panel" role="tabpanel" aria-labelledby="tab-skins"></div>
        <div id="panel-eggs" class="tab-panel" role="tabpanel" aria-labelledby="tab-eggs"></div>
        <div id="panel-log" class="tab-panel" role="tabpanel" aria-labelledby="tab-log"></div>
        <div id="panel-stats" class="tab-panel" role="tabpanel" aria-labelledby="tab-stats"></div>
        <div id="panel-prestige" class="tab-panel" role="tabpanel" aria-labelledby="tab-prestige"></div>
        <div id="panel-achievements" class="tab-panel" role="tabpanel" aria-labelledby="tab-achievements"></div>
        <div id="panel-settings" class="tab-panel" role="tabpanel" aria-labelledby="tab-settings"></div>
      </div>
    </div>

    <!-- Bottom Tab Bar (Section 72: navigation system) -->
    <div id="bottom-tabs" role="tablist" aria-label="Game sections">
      <button class="tab-btn active" data-tab="generators" data-label="Generators" role="tab" aria-selected="true" id="tab-generators">&#9881;</button>
      <button class="tab-btn" data-tab="upgrades" data-label="Upgrades" role="tab" aria-selected="false" id="tab-upgrades">&#11014;</button>
      <button class="tab-btn" data-tab="zones" data-label="Zones" role="tab" aria-selected="false" id="tab-zones">&#127757;</button>
      <button class="tab-btn" data-tab="achievements" data-label="Achievements" role="tab" aria-selected="false" id="tab-achievements">&#127942;</button>
      <button class="tab-btn" data-tab="stats" data-label="Stats" role="tab" aria-selected="false" id="tab-stats">&#128202;</button>
      <button class="tab-btn hidden" data-tab="crew" data-label="Crew">&#128100;</button>
      <button class="tab-btn hidden" data-tab="fleet" data-label="Fleet">&#128640;</button>
      <button class="tab-btn hidden" data-tab="research" data-label="Research">&#128300;</button>
      <button class="tab-btn hidden" data-tab="log" data-label="Log">&#128214;</button>
      <button class="tab-btn hidden" data-tab="prestige" data-label="Prestige">&#9733;</button>
      <button class="tab-btn hidden" data-tab="collection" data-label="Album">&#128218;</button>
      <button class="tab-btn hidden" data-tab="contracts" data-label="Contracts">&#128203;</button>
      <button class="tab-btn hidden" data-tab="boosters" data-label="Boosters">&#9889;</button>
      <button class="tab-btn hidden" data-tab="eggs" data-label="Eggs">&#129370;</button>
      <button class="tab-btn" data-tab="settings" data-label="Settings">&#9881;&#65039;</button>
      <button class="tab-btn more-tab-btn" id="more-tab-btn" data-label="More">&#8943;</button>
    </div>

    <!-- More Sheet Overlay -->
    <div id="more-sheet-overlay" class="hidden">
      <div id="more-sheet-backdrop"></div>
      <div id="more-sheet">
        <div id="more-sheet-handle"></div>
        <div id="more-sheet-title">More Tabs</div>
        <div id="more-sheet-grid"></div>
      </div>
    </div>

    <!-- Modals (Section 74: spring animations, focus trap) -->
    <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-label="Dialog">
      <div id="modal-backdrop"></div>
      <div id="modal-content"></div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirm-overlay" class="hidden" role="alertdialog" aria-modal="true" aria-label="Confirmation">
      <div id="confirm-backdrop"></div>
      <div id="confirm-content">
        <div id="confirm-title"></div>
        <div id="confirm-message"></div>
        <div id="confirm-actions">
          <button id="confirm-cancel" class="btn-secondary">Cancel</button>
          <button id="confirm-ok" class="btn-primary">OK</button>
        </div>
      </div>
    </div>

    <!-- Event Banner -->
    <div id="event-banner" class="hidden"></div>

    <!-- Achievement Banner -->
    <div id="achievement-banner" class="hidden"></div>

    <!-- Toast Notifications (Section 75: queue system) -->
    <div id="toast-container" role="log" aria-live="polite" aria-label="Notifications"></div>

    <!-- Error Recovery Banner -->
    <div id="error-banner" class="hidden" role="alert">
      <span id="error-banner-text"></span>
      <button id="error-banner-dismiss" aria-label="Dismiss error">&times;</button>
    </div>

    <!-- Performance Warning -->
    <div id="perf-warning" class="hidden" role="status" aria-live="polite">
      <span id="perf-warning-text">Performance degraded — effects reduced</span>
    </div>

    <!-- Tutorial Overlay (Section 86: progressive onboarding) -->
    <div id="tutorial-overlay" class="hidden" role="dialog" aria-modal="true" aria-label="Tutorial">
      <div id="tutorial-spotlight" aria-hidden="true"></div>
      <div id="tutorial-tooltip">
        <div id="tutorial-step-indicator" aria-hidden="true"></div>
        <div id="tutorial-text"></div>
        <div id="tutorial-actions">
          <button id="tutorial-skip" class="btn-text">Skip</button>
          <button id="tutorial-next" class="btn-primary btn-sm">Next</button>
        </div>
      </div>
    </div>

    <!-- Transition Overlay -->
    <div id="transition-overlay" class="hidden"></div>

    <!-- Celebration Overlay (Section 87: 5-tier ceremonies) -->
    <div id="celebration-overlay" class="hidden" aria-hidden="true">
      <canvas id="celebration-canvas"></canvas>
      <div id="celebration-content" class="hidden">
        <div id="celebration-icon"></div>
        <div id="celebration-title"></div>
        <div id="celebration-subtitle"></div>
      </div>
    </div>

    <!-- Big Bang Prestige Animation -->
    <div id="big-bang-overlay" class="hidden" aria-hidden="true">
      <canvas id="big-bang-canvas"></canvas>
      <div id="big-bang-text" class="hidden"></div>
    </div>

    <!-- Mini-Game Overlay -->
    <div id="mini-game-overlay" class="hidden">
      <div id="mini-game-header">
        <span id="mini-game-title"></span>
        <span id="mini-game-timer"></span>
      </div>
      <canvas id="mini-game-canvas"></canvas>
      <div id="mini-game-hud"></div>
      <div id="mini-game-result" class="hidden"></div>
    </div>
  </div>

  <script src="js/numbers.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/expansion.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/juice.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/events.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
