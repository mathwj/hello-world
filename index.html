<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor Bilíngue</title>
<style>
:root{
  --paper:#F7F4EC;
  --panel:#EFEBE0;
  --chip:#E7E2D4;
  --ink:#211C15;
  --muted:#8A8172;
  --line:#DFD9C8;
  --active:#C22233;
  --spoken:#77121F;
  --pill:#2A3439;
  --pill-ink:#F4F2EC;
  --fs:1;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141210;
    --panel:#1D1A16;
    --chip:#26221C;
    --ink:#E8E2D4;
    --muted:#8F887A;
    --line:#2C2822;
    --active:#E05A6B;
    --spoken:#F2A9B1;
    --pill:#E8E2D4;
    --pill-ink:#1B1815;
  }
}
:root[data-theme="dark"]{
  --paper:#141210;
  --panel:#1D1A16;
  --chip:#26221C;
  --ink:#E8E2D4;
  --muted:#8F887A;
  --line:#2C2822;
  --active:#E05A6B;
  --spoken:#F2A9B1;
  --pill:#E8E2D4;
  --pill-ink:#1B1815;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.sent:focus-visible{
  outline:2px solid var(--active);
  outline-offset:2px;
  border-radius:.3rem;
}
[hidden]{display:none !important}

/* ---------- edit screen ---------- */
#editScreen{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:2.2rem 1.3rem 3rem;
}
.edit-inner{
  width:100%;
  max-width:42rem;
  display:flex;
  flex-direction:column;
  gap:1rem;
}
.edit-inner h1{
  font-family:"EB Garamond",Georgia,serif;
  font-weight:600;
  font-size:2rem;
  margin:0;
  letter-spacing:-.01em;
}
.edit-inner .sub{
  margin:-.4rem 0 .4rem;
  color:var(--muted);
  font-size:.85rem;
  line-height:1.55;
}
#titleInput,#input,#manualInput{
  width:100%;
  font-family:"EB Garamond",Georgia,serif;
  font-size:1.15rem;
  line-height:1.7;
  color:var(--ink);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:.8rem;
  padding:.8rem 1rem;
}
#input{min-height:16rem;resize:vertical}
.big-btn{
  align-self:flex-start;
  background:var(--pill);
  color:var(--pill-ink);
  font-weight:600;
  border-radius:2rem;
  padding:.75rem 1.6rem;
}
.big-btn:disabled{opacity:.5;cursor:wait}
.edit-status{font-size:.82rem;color:var(--muted);min-height:1.2rem}
.edit-status .err{color:var(--active)}

/* ---------- reader ---------- */
#readerScreen{min-height:100%;display:flex;flex-direction:column}
.rtop{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  gap:.7rem;
  padding:.75rem 1rem;
  background:var(--paper);
  border-bottom:1px solid var(--line);
}
.rtop .rtitle{
  font-weight:600;
  font-size:.95rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.icon-btn{
  display:grid;
  place-items:center;
  width:2.3rem;height:2.3rem;
  border-radius:.6rem;
  border:1px solid var(--line);
  background:var(--paper);
  flex:none;
}
.icon-btn svg{width:1.15rem;height:1.15rem}

#doc{
  flex:1;
  width:100%;
  max-width:46rem;
  margin:0 auto;
  padding:1.6rem 1.4rem 9rem;
  font-family:"EB Garamond",Georgia,"Times New Roman",serif;
  font-size:calc(1.3rem * var(--fs));
  line-height:1.72;
}
.doc-title{
  font-weight:700;
  font-size:1.5em;
  margin:0 0 1em;
  text-wrap:balance;
}
.pair{margin:0 0 1.4em}
.block{margin:0 0 1.2em}
.block.b-orig{border-bottom:1px solid var(--line);padding-bottom:1.2em}
body.disp-orig .b-pt{display:none}
body.disp-pt .b-orig{display:none}
body.disp-orig .b-orig,body.disp-pt .b-pt{border-bottom:none;padding-bottom:0}
@media (min-width: 60rem){
  body.disp-both #doc{max-width:76rem}
  body.disp-both .pair{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 2.6rem;
  }
  body.disp-both .block.b-orig{border-bottom:none;padding-bottom:0;border-right:1px solid var(--line);padding-right:2.6rem;margin-right:-1.3rem}
}
.sent{cursor:pointer;transition:color .15s ease}
.sent:hover{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:.2em}
.sent.active{color:var(--active)}
.sent.active .w.spoken{color:var(--spoken)}

/* ---------- manual translation fallback ---------- */
#manualBox{
  font-family:"Archivo",system-ui,sans-serif;
  font-size:.86rem;
  line-height:1.55;
  color:var(--muted);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:.8rem;
  padding:1rem;
  margin:0 0 1.6rem;
  display:flex;
  flex-direction:column;
  gap:.7rem;
}
#manualBox p{margin:0}
#manualBox a{color:var(--active)}
#manualInput{min-height:9rem;resize:vertical;font-size:1rem}
#manualBox .big-btn{font-size:.85rem;padding:.55rem 1.2rem}

/* ---------- floating pill ---------- */
#pill{
  position:fixed;
  left:50%;
  bottom:1.1rem;
  transform:translateX(-50%);
  z-index:10;
  display:flex;
  align-items:center;
  gap:.4rem;
  background:var(--pill);
  color:var(--pill-ink);
  border-radius:2.2rem;
  padding:.45rem .7rem;
  box-shadow:0 6px 24px rgba(0,0,0,.28);
}
#pill button{
  display:grid;
  place-items:center;
  width:2.9rem;height:2.9rem;
  border-radius:50%;
  color:var(--pill-ink);
}
#pill button:hover{background:rgba(128,128,128,.18)}
#pill button:disabled{opacity:.4}
#pill svg{width:1.4rem;height:1.4rem}
#btnPlay svg{width:1.6rem;height:1.6rem}

/* ---------- settings sheet ---------- */
#scrim{
  position:fixed;inset:0;z-index:19;
  background:rgba(0,0,0,.35);
}
#sheet{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:20;
  background:var(--paper);
  border-top-left-radius:1.4rem;
  border-top-right-radius:1.4rem;
  box-shadow:0 -8px 30px rgba(0,0,0,.25);
  padding:.7rem 1.1rem 1.4rem;
  max-width:34rem;
  margin:0 auto;
}
#sheet .grab{
  width:2.6rem;height:.28rem;
  background:var(--line);
  border-radius:1rem;
  margin:.2rem auto .9rem;
}
.sheet-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:.65rem;
}
.chip{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.5rem;
  background:var(--chip);
  border-radius:.9rem;
  padding:.85rem .6rem;
  font-weight:600;
  font-size:.92rem;
  color:var(--ink);
}
.chip svg{width:1.1rem;height:1.1rem;flex:none}
.chip.split{padding:0;overflow:hidden}
.chip.split button{flex:1;padding:.85rem 0;color:var(--ink)}
.chip.split button{display:flex;align-items:center;justify-content:center;gap:.4rem}
.chip.split button:first-child{border-right:1px solid var(--line)}
.chip.split#fontChip button:first-child{font-size:.85rem}
.chip.split#fontChip button:last-child{font-size:1.15rem}
.chip.split button svg{width:1.1rem;height:1.1rem}
.chip.split button.on{background:var(--pill);color:var(--pill-ink)}
.chip.on{background:var(--pill);color:var(--pill-ink)}
.chip.on svg{color:var(--pill-ink)}
.sheet-row{
  grid-column:1 / -1;
  display:flex;
  align-items:center;
  gap:.6rem;
  font-size:.82rem;
  color:var(--muted);
}
.sheet-row select,.sheet-row input{
  flex:1;
  font:inherit;
  color:var(--ink);
  background:var(--chip);
  border:1px solid var(--line);
  border-radius:.7rem;
  padding:.5rem .6rem;
  min-width:0;
}
.mini-btn{
  background:var(--pill);
  color:var(--pill-ink);
  font-weight:600;
  font-size:.78rem;
  border-radius:.6rem;
  padding:.5rem .8rem;
}

/* ---------- toast ---------- */
#toast{
  position:fixed;
  left:50%;bottom:5.6rem;
  transform:translateX(-50%);
  z-index:30;
  background:var(--pill);
  color:var(--pill-ink);
  font-size:.82rem;
  border-radius:.8rem;
  padding:.55rem 1rem;
  max-width:min(90vw, 30rem);
  text-align:center;
  opacity:0;
  transition:opacity .25s ease;
  pointer-events:none;
}
#toast.show{opacity:1}

@media (prefers-reduced-motion: reduce){
  .sent,#toast{transition:none}
}
</style>

    <button id="btnTranslate" class="big-btn">Translate &amp; read</button>

<script>
"use strict";
const $ = id => document.getElementById(id);
const synth = window.speechSynthesis;

let units = [];            // phrase units: {orig, pt, para, origEl, ptEl, origWords:[{s,e,el}], ptWords:[{s,e,el}]}
let detectedLang = "";
let queue = [];            // {i, side, text, lang}
let qPos = 0;
let state = "idle";        // idle | playing | paused
let stopped = false;
let playGen = 0;           // invalidates callbacks from utterances/audio of an earlier run
let currentUtterance = null;
let activeEngine = "device"; // engine used by the item currently sounding
let googleDown = false;      // set after the online voice fails once; falls back to device
let elDown = false;          // set after ElevenLabs fails once; falls back to Google/device
const elCache = new Map();   // voice|lang|text -> {url, align} so replays don't re-spend credits
let player = null;           // shared Audio element (reuse keeps iOS playback unlocked)
let progTimer = null;
let startWatchdog = null;

const RATES = [0.8, 1, 1.2, 1.5];
const FS_MIN = 0.8, FS_MAX = 1.5, FS_STEP = 0.1;
let settings = {disp:"both", audio:"both", rateOrig:1, ratePt:1, fs:1, theme:"", engine:"google", elKey:"", elVoice:""};

/* ---------- persistence ---------- */
function loadSettings(){
  try{
    const raw = localStorage.getItem("lb_settings");
    if (raw){
      const s = JSON.parse(raw);
      if (!("engine" in s)) s.audio = "both"; // migrate pre-phrase settings to the bilingual default
      if ("rate" in s && !("ratePt" in s)){ s.rateOrig = s.rate; s.ratePt = s.rate; delete s.rate; }
      Object.assign(settings, s);
    }
  }catch(e){}
  if (RATES.indexOf(settings.rateOrig) < 0) settings.rateOrig = 1;
  if (RATES.indexOf(settings.ratePt) < 0) settings.ratePt = 1;
}
function saveSettings(){
  try{ localStorage.setItem("lb_settings", JSON.stringify(settings)); }catch(e){}
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, ms){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms || 3200);
}

/* ---------- text segmentation: sentences, then short phrases ---------- */
function splitSentences(paragraph){
  try{
    const seg = new Intl.Segmenter(undefined, {granularity:"sentence"});
    const out = [...seg.segment(paragraph)].map(s => s.segment.trim()).filter(Boolean);
    if (out.length) return out;
  }catch(e){ /* Intl.Segmenter unavailable */ }
  return paragraph.split(/(?<=[.!?…])\s+/).map(s => s.trim()).filter(Boolean);
}

const MAX_WORDS = 7, MIN_WORDS = 3;
const CONNECTORS = new RegExp("^(?:" + [
  "and","but","or","nor","so","yet","because","although","though","while","when","whenever",
  "where","which","who","whom","whose","that","if","unless","until","after","before","since",
  "as","than","with","without","about","against","between","through","during","into","from",
  "to","for","of","in","on","at","by","like","towards","despite",
  "e","mas","ou","porque","embora","enquanto","quando","onde","que","quem","se","até",
  "depois","antes","como","com","sem","sobre","entre","para","de","em","por","durante","pois"
].join("|") + ")$", "i");

function isConnector(word){
  return CONNECTORS.test(word.replace(/[^\p{L}'’-]/gu, ""));
}

function chunkWords(words){
  if (words.length <= MAX_WORDS) return [words];
  const cands = [];
  for (let i = MIN_WORDS; i <= words.length - MIN_WORDS; i++){
    if (isConnector(words[i])) cands.push(i);
  }
  const mid = words.length / 2;
  const cut = cands.length
    ? cands.reduce((a, b) => Math.abs(b - mid) < Math.abs(a - mid) ? b : a)
    : Math.round(mid);
  return chunkWords(words.slice(0, cut)).concat(chunkWords(words.slice(cut)));
}

function splitPhrases(sentence){
  const parts = sentence.split(/(?<=[,;:—–…])\s+/).map(s => s.trim()).filter(Boolean);
  const merged = [];
  parts.forEach(p => {
    const n = p.split(/\s+/).length;
    const prevN = merged.length ? merged[merged.length - 1].split(/\s+/).length : 0;
    if (merged.length && (n < MIN_WORDS || prevN < MIN_WORDS)) merged[merged.length - 1] += " " + p;
    else merged.push(p);
  });
  const out = [];
  merged.forEach(p => chunkWords(p.split(/\s+/)).forEach(ws => out.push(ws.join(" "))));
  return out;
}

function parseText(text){
  const paras = text.split(/\n{2,}/).map(p => p.replace(/\s+/g," ").trim()).filter(Boolean);
  const out = [];
  paras.forEach((p, pi) =>
    splitSentences(p).forEach(sent =>
      splitPhrases(sent).forEach(ph => out.push({orig:ph, pt:"", para:pi}))));
  return out;
}

/* ---------- translation ---------- */
async function translateGtx(text){
  const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pt-BR&dt=t&q="
            + encodeURIComponent(text);
  const r = await fetch(url);
  if (!r.ok) throw new Error("gtx " + r.status);
  const d = await r.json();
  if (!detectedLang && typeof d[2] === "string") detectedLang = d[2];
  return d[0].map(seg => seg[0]).join("");
}

function decodeEntities(s){
  const t = document.createElement("textarea");
  t.innerHTML = s;
  return t.value;
}

async function translateMyMemory(text){
  const src = (detectedLang || "en").split("-")[0];
  const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text)
            + "&langpair=" + encodeURIComponent(src + "|pt-BR");
  const r = await fetch(url);
  if (!r.ok) throw new Error("mymemory " + r.status);
  const j = await r.json();
  if (j.responseStatus !== 200 || !j.responseData) throw new Error("mymemory response");
  return decodeEntities(j.responseData.translatedText);
}

function matchCase(orig, pt){
  const c = orig.charAt(0);
  if (pt && c && c === c.toLowerCase() && c !== c.toUpperCase())
    return pt.charAt(0).toLowerCase() + pt.slice(1);
  return pt;
}

async function translatePhrase(text){
  let pt;
  try { pt = await translateGtx(text); }
  catch (e) { pt = await translateMyMemory(text); }
  return matchCase(text, pt);
}

async function mapLimit(items, limit, fn){
  const out = new Array(items.length);
  let i = 0;
  const workers = Array.from({length: Math.min(limit, items.length)}, async () => {
    while (i < items.length){ const idx = i++; out[idx] = await fn(items[idx], idx); }
  });
  await Promise.all(workers);
  return out;
}

function languageName(code){
  try { return new Intl.DisplayNames(["en"], {type:"language"}).of(code) || code; }
  catch (e) { return code; }
}
function origShort(){
  return (detectedLang || "EN").split("-")[0].toUpperCase();
}

/* ---------- rendering ---------- */
function buildPhraseSpan(u, i, side){
  const text = side === "orig" ? u.orig : u.pt;
  const el = document.createElement("span");
  el.className = "sent";
  el.dataset.i = i;
  el.title = "Read from here";
  const words = [];
  const re = /\S+/g;
  let m, last = 0;
  while ((m = re.exec(text))){
    if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
    const w = document.createElement("span");
    w.className = "w";
    w.textContent = m[0];
    el.appendChild(w);
    words.push({s:m.index, e:m.index + m[0].length, el:w});
    last = m.index + m[0].length;
  }
  if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
  if (side === "orig"){ u.origEl = el; u.origWords = words; }
  else { u.ptEl = el; u.ptWords = words; }
  return el;
}

function renderDoc(){
  const doc = $("doc");
  doc.innerHTML = "";
  const title = $("titleInput").value.trim();
  $("rtitle").textContent = title || "Leitor Bilíngue";
  if (title){
    const h = document.createElement("div");
    h.className = "doc-title";
    h.textContent = title;
    doc.appendChild(h);
  }
  const paras = [...new Set(units.map(u => u.para))];
  paras.forEach(pi => {
    const pair = document.createElement("div");
    pair.className = "pair";
    ["orig","pt"].forEach(side => {
      const block = document.createElement("p");
      block.className = "block b-" + side;
      if (side === "pt") block.lang = "pt-BR";
      units.forEach((u, i) => {
        if (u.para !== pi) return;
        block.appendChild(buildPhraseSpan(u, i, side));
        block.appendChild(document.createTextNode(" "));
      });
      pair.appendChild(block);
    });
    doc.appendChild(pair);
  });
  doc.onclick = e => {
    const el = e.target.closest(".sent");
    if (el && !$("btnPlay").disabled) startFrom(+el.dataset.i);
  };
}

function showManualBox(){
  const doc = $("doc");
  const box = document.createElement("div");
  box.id = "manualBox";
  box.innerHTML =
    '<p>Automatic translation needs internet access to a translation service, which is not available here. ' +
    'Paste a Portuguese translation below (same sentences, same order) and the read-aloud highlighting works exactly the same.</p>' +
    '<textarea id="manualInput" spellcheck="false" placeholder="Cole aqui a tradução em português…"></textarea>' +
    '<button id="btnManual" class="big-btn">Use this translation</button>';
  doc.insertBefore(box, doc.firstChild);
  $("btnManual").addEventListener("click", useManualTranslation);
}

function useManualTranslation(){
  const text = $("manualInput").value.trim();
  if (!text){ toast("Paste the Portuguese translation first."); return; }
  const ptUnits = parseText(text);
  units.forEach((u, i) => { u.pt = ptUnits[i] ? ptUnits[i].orig : ""; });
  if (ptUnits.length > units.length){
    units[units.length - 1].pt += " " + ptUnits.slice(units.length).map(p => p.orig).join(" ");
  }
  units.forEach(u => { if (!u.pt) u.pt = u.orig; });
  renderDoc();
  $("btnPlay").disabled = false;
  toast(units.length + " phrases paired — press play.");
}

/* ---------- translate flow ---------- */
function setEditStatus(msg, isError){
  $("editStatus").innerHTML = "";
  const span = document.createElement("span");
  if (isError) span.className = "err";
  span.textContent = msg;
  $("editStatus").appendChild(span);
}

async function doTranslate(){
  const text = $("input").value.trim();
  if (!text){ setEditStatus("Type or paste some text first.", true); return; }
  stopPlayback();
  units = parseText(text);
  detectedLang = "";
  $("btnTranslate").disabled = true;
  setEditStatus("Traduzindo… (" + units.length + " phrase" + (units.length === 1 ? "" : "s") + ")");

  let failures = 0;
  await mapLimit(units, 4, async u => {
    try { u.pt = await translatePhrase(u.orig); }
    catch (e) { u.pt = u.orig; failures++; }
  });

  $("btnTranslate").disabled = false;
  setEditStatus("");
  renderDoc();
  $("editScreen").hidden = true;
  $("readerScreen").hidden = false;
  window.scrollTo(0, 0);

  if (failures === units.length){
    showManualBox();
    $("btnPlay").disabled = true;
    toast("Could not reach a translation service.", 4200);
    return;
  }
  $("btnPlay").disabled = false;
  applySettings();
  refreshOrigVoice();
  if (failures) toast(failures + " phrase(s) kept in the original (translation failed).", 4200);
  else if (detectedLang) toast("Detected " + languageName(detectedLang) + " — tap play, or tap any phrase.");
}

function backToEdit(){
  stopPlayback();
  closeSheet();
  $("readerScreen").hidden = true;
  $("editScreen").hidden = false;
  $("btnPlay").disabled = true;
}

/* ---------- device voices ---------- */
function allVoices(){ return synth ? synth.getVoices() : []; }

function voiceScore(v){
  let s = 0;
  if (/enhanced|premium|natural|neural|aprimorada|melhorada|superior/i.test(v.name)) s += 4;
  if (/google/i.test(v.name)) s += 2;
  if (/siri/i.test(v.name)) s += 1;
  if (v.default) s += 1;
  return s;
}

function populateVoices(){
  const sel = $("voice");
  const keep = sel.value;
  sel.innerHTML = '<option value="">Automatic</option>';
  allVoices().filter(v => v.lang.toLowerCase().replace("_","-").startsWith("pt"))
    .sort((a, b) => voiceScore(b) - voiceScore(a))
    .forEach(v => {
      const o = document.createElement("option");
      o.value = v.name;
      o.textContent = v.name + " (" + v.lang + ")";
      sel.appendChild(o);
    });
  sel.value = keep;
  if (sel.value !== keep) sel.value = "";
}

function pickVoice(lang){
  if (!lang) return null;
  const voices = allVoices();
  const norm = v => v.lang.toLowerCase().replace("_","-");
  const l = lang.toLowerCase();
  const cands = voices.filter(v => norm(v).startsWith(l.split("-")[0]));
  if (!cands.length) return null;
  cands.sort((a, b) =>
    (voiceScore(b) + (norm(b) === l ? 2 : 0)) - (voiceScore(a) + (norm(a) === l ? 2 : 0)));
  return cands[0];
}

let origVoice = null;
function refreshOrigVoice(){ origVoice = pickVoice(detectedLang || "en"); }

function ptVoice(){
  const name = $("voice").value;
  if (name){
    const v = allVoices().find(v => v.name === name);
    if (v) return v;
  }
  return pickVoice("pt-br") || pickVoice("pt");
}

/* ---------- playback ---------- */
function buildQueue(){
  const q = [];
  units.forEach((u, i) => {
    if (settings.audio === "orig" || settings.audio === "both")
      q.push({i, side:"orig", text:u.orig, lang: detectedLang || "en"});
    if (settings.audio === "pt" || settings.audio === "both")
      q.push({i, side:"pt", text:u.pt, lang:"pt-BR"});
  });
  return q;
}

function clearHighlights(){
  document.querySelectorAll(".sent.active").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".w.spoken").forEach(el => el.classList.remove("spoken"));
}

function highlightUnit(item){
  clearHighlights();
  const u = units[item.i];
  if (!u) return;
  [u.origEl, u.ptEl].forEach(el => { if (el) el.classList.add("active"); });
  const target = item.side === "orig"
    ? (document.body.classList.contains("disp-pt") ? u.ptEl : u.origEl)
    : (document.body.classList.contains("disp-orig") ? u.origEl : u.ptEl);
  if (target){
    try { target.scrollIntoView({block:"center", behavior:"smooth"}); }
    catch(e){ target.scrollIntoView(); }
  }
}

function markProgress(item, charIndex){
  const u = units[item.i];
  if (!u || typeof charIndex !== "number") return;
  const words = item.side === "orig" ? u.origWords : u.ptWords;
  if (!words) return;
  words.forEach(w => w.el.classList.toggle("spoken", w.s <= charIndex));
}

/* --- online voice (Google Translate TTS via a shared <audio> element) --- */
function getPlayer(){
  if (!player){
    player = new Audio();
    player.preload = "auto";
  }
  return player;
}

function cleanupPlayer(){
  clearTimeout(startWatchdog);
  startWatchdog = null;
  stopProgressLoop();
  if (player){
    player.onerror = player.onplay = player.onended = null;
    if (!player.paused) player.pause();
  }
}

function startProgressLoop(item, gen, a, align){
  stopProgressLoop();
  progTimer = setInterval(() => {
    if (gen !== playGen || a.paused) return;
    let idx;
    if (align && align.character_start_times_seconds && align.character_start_times_seconds.length){
      const times = align.character_start_times_seconds;
      const t = a.currentTime;
      idx = 0;
      while (idx < times.length - 1 && times[idx + 1] <= t) idx++;
    } else {
      const d = a.duration;
      if (!d || !isFinite(d)) return;
      idx = Math.floor(Math.min(1, a.currentTime / d) * item.text.length);
    }
    markProgress(item, idx);
  }, 100);
}
function stopProgressLoop(){
  clearInterval(progTimer);
  progTimer = null;
}

function rateFor(item){
  return item.side === "pt" ? settings.ratePt : settings.rateOrig;
}

/* --- ElevenLabs voice (user-supplied API key; key goes only to api.elevenlabs.io) --- */
let elVoicesLoaded = false;
async function loadElVoices(){
  const r = await fetch("https://api.elevenlabs.io/v1/voices", {headers:{"xi-api-key": settings.elKey}});
  if (!r.ok) throw new Error("el " + r.status);
  const j = await r.json();
  const sel = $("elVoice");
  sel.innerHTML = "";
  (j.voices || []).forEach(v => {
    const o = document.createElement("option");
    o.value = v.voice_id;
    o.textContent = v.name;
    sel.appendChild(o);
  });
  if (j.voices && j.voices.length && !j.voices.some(v => v.voice_id === settings.elVoice))
    settings.elVoice = j.voices[0].voice_id;
  sel.value = settings.elVoice;
  elVoicesLoaded = true;
  saveSettings();
}

function elCacheKey(item){
  return settings.elVoice + "|" + item.lang + "|" + item.text;
}

async function elFetch(item){
  const key = elCacheKey(item);
  if (elCache.has(key)) return elCache.get(key);
  const r = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + settings.elVoice
      + "/with-timestamps?output_format=mp3_44100_128", {
    method: "POST",
    headers: {"xi-api-key": settings.elKey, "Content-Type": "application/json"},
    body: JSON.stringify({
      text: item.text,
      model_id: "eleven_turbo_v2_5",
      language_code: (item.lang || "en").split("-")[0]
    })
  });
  if (!r.ok) throw new Error("el " + r.status);
  const j = await r.json();
  const bytes = Uint8Array.from(atob(j.audio_base64), c => c.charCodeAt(0));
  const entry = {
    url: URL.createObjectURL(new Blob([bytes], {type:"audio/mpeg"})),
    align: j.alignment || null
  };
  elCache.set(key, entry);
  return entry;
}

async function speakEl(item, gen, done){
  try{
    if (!settings.elVoice && !elVoicesLoaded) await loadElVoices();
    if (!settings.elVoice) throw new Error("el novoice");
    const entry = await elFetch(item);
    if (gen !== playGen || stopped) return;
    const a = getPlayer();
    cleanupPlayer();
    a.onerror = () => elFail(item, gen, done, "audio");
    a.onplay = () => {
      if (gen !== playGen) return;
      a.playbackRate = rateFor(item);
      activeEngine = "el";
      highlightUnit(item);
      startProgressLoop(item, gen, a, entry.align);
    };
    a.onended = () => {
      if (gen !== playGen) return;
      stopProgressLoop();
      markProgress(item, item.text.length);
      done();
    };
    a.src = entry.url;
    a.playbackRate = rateFor(item);
    const p = a.play();
    if (p && p.catch) p.catch(() => elFail(item, gen, done, "play"));
    const nxt = queue[qPos + 1]; // warm the next phrase while this one plays
    if (nxt) elFetch(nxt).catch(() => {});
  }catch(e){
    elFail(item, gen, done, e && e.message || "");
  }
}

function elFail(item, gen, done, why){
  if (gen !== playGen || stopped) return;
  cleanupPlayer();
  if (!elDown){
    elDown = true;
    toast(/401/.test(why) ? "Invalid ElevenLabs API key — falling back."
        : /402|429/.test(why) ? "ElevenLabs quota exceeded — falling back."
        : "ElevenLabs unavailable here — falling back.", 4200);
    applySettings();
  }
  if (!googleDown) speakGoogle(item, gen, done);
  else speakDevice(item, gen, done);
}

function speakGoogle(item, gen, done){
  const a = getPlayer();
  cleanupPlayer();
  const fail = () => {
    if (gen !== playGen || stopped) return;
    cleanupPlayer();
    if (!googleDown){
      googleDown = true;
      toast("Online voice unavailable here — using the device voice.", 4200);
      applySettings();
    }
    speakDevice(item, gen, done);
  };
  a.onerror = fail;
  a.onplay = () => {
    if (gen !== playGen) return;
    clearTimeout(startWatchdog);
    a.playbackRate = rateFor(item);
    activeEngine = "google";
    highlightUnit(item);
    startProgressLoop(item, gen, a);
  };
  a.onended = () => {
    if (gen !== playGen) return;
    stopProgressLoop();
    markProgress(item, item.text.length);
    done();
  };
  a.src = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="
        + encodeURIComponent(item.lang) + "&q=" + encodeURIComponent(item.text);
  a.playbackRate = rateFor(item);
  startWatchdog = setTimeout(fail, 6000);
  const p = a.play();
  if (p && p.catch) p.catch(fail);
}

/* --- device voice (speechSynthesis) --- */
function speakDevice(item, gen, done){
  if (!synth){ done(); return; }
  activeEngine = "device";
  const u = new SpeechSynthesisUtterance(item.text);
  u.lang = item.lang;
  const v = item.side === "pt" ? ptVoice() : origVoice;
  if (v) u.voice = v;
  u.rate = rateFor(item);
  u.onstart = () => { if (gen === playGen) highlightUnit(item); };
  u.onboundary = e => { if (gen === playGen && (e.name === "word" || e.name === undefined)) markProgress(item, e.charIndex); };
  u.onend = () => { if (!stopped && gen === playGen) done(); };
  u.onerror = e => {
    if (stopped || gen !== playGen || e.error === "interrupted" || e.error === "canceled") return;
    done();
  };
  currentUtterance = u; // keep a reference so the utterance is not garbage-collected mid-speech
  synth.speak(u);
}

function speakNext(){
  if (stopped) return;
  if (qPos >= queue.length){ finishPlayback(); return; }
  const item = queue[qPos];
  const gen = playGen;
  const done = () => { if (!stopped && gen === playGen){ qPos++; speakNext(); } };
  if (settings.engine === "el" && settings.elKey && !elDown) speakEl(item, gen, done);
  else if ((settings.engine === "google" || settings.engine === "el") && !googleDown) speakGoogle(item, gen, done);
  else speakDevice(item, gen, done);
}

function startFrom(unitIdx){
  stopped = true;
  if (synth) synth.cancel();
  cleanupPlayer();
  stopped = false;
  playGen++;
  queue = buildQueue();
  qPos = queue.findIndex(item => item.i >= unitIdx);
  if (qPos < 0) qPos = 0;
  state = "playing";
  setPlayIcon(true);
  speakNext();
}

function currentUnit(){
  return queue.length && queue[Math.min(qPos, queue.length - 1)] ? queue[Math.min(qPos, queue.length - 1)].i : 0;
}

function togglePlay(){
  if (state === "playing"){
    if (activeEngine !== "device" && player) player.pause();
    else if (synth) synth.pause();
    state = "paused";
    setPlayIcon(false);
  } else if (state === "paused"){
    if (activeEngine !== "device" && player) player.play();
    else if (synth) synth.resume();
    state = "playing";
    setPlayIcon(true);
  } else {
    startFrom(0);
  }
}

function stopPlayback(){
  stopped = true;
  playGen++;
  if (synth) synth.cancel();
  cleanupPlayer();
  finishPlayback();
}

function finishPlayback(){
  state = "idle";
  clearHighlights();
  setPlayIcon(false);
}

function setPlayIcon(playing){
  $("icoPlay").hidden = playing;
  $("icoPause").hidden = !playing;
}

function stepUnit(delta){
  if ($("btnPlay").disabled || !units.length) return;
  const cur = state === "idle" ? 0 : currentUnit();
  const next = Math.min(units.length - 1, Math.max(0, cur + delta));
  startFrom(next);
}

/* ---------- settings UI ---------- */
function applySettings(){
  document.body.classList.remove("disp-both","disp-orig","disp-pt");
  document.body.classList.add("disp-" + settings.disp);
  const o = origShort();
  $("dispLabel").textContent = settings.disp === "both" ? o + "/PT" : settings.disp === "orig" ? o : "PT";
  $("audioLabel").textContent = settings.audio === "both" ? o + "+PT" : settings.audio === "orig" ? o : "PT";
  $("rateOrigBtn").textContent = o + " " + settings.rateOrig + "x";
  $("ratePtBtn").textContent = "PT " + settings.ratePt + "x";
  $("engineLabel").textContent =
    settings.engine === "el" ? (elDown ? "ElevenLabs (off)" : "ElevenLabs") :
    (settings.engine === "google" && !googleDown) ? "Google voice" : "Device voice";
  if (document.activeElement !== $("elKeyInput")) $("elKeyInput").value = settings.elKey || "";
  $("elVoiceRow").hidden = !settings.elKey;
  document.documentElement.style.setProperty("--fs", settings.fs);
  if (settings.theme) document.documentElement.dataset.theme = settings.theme;
  else delete document.documentElement.dataset.theme;
  $("chipDark").classList.toggle("on", settings.theme === "dark");
  $("chipLight").classList.toggle("on", settings.theme === "light");
  saveSettings();
}

function openSheet(){ $("sheet").hidden = false; $("scrim").hidden = false; }
function closeSheet(){ $("sheet").hidden = true; $("scrim").hidden = true; }

function restartIfSpeaking(){
  if (state !== "idle") startFrom(currentUnit());
}

/* ---------- wiring ---------- */
$("btnTranslate").addEventListener("click", doTranslate);
$("btnBack").addEventListener("click", backToEdit);
$("btnEditPill").addEventListener("click", backToEdit);
$("btnPlay").addEventListener("click", togglePlay);
$("btnPrev").addEventListener("click", () => stepUnit(-1));
$("btnNext").addEventListener("click", () => stepUnit(1));
$("btnSettings").addEventListener("click", openSheet);
$("scrim").addEventListener("click", closeSheet);

$("chipDisp").addEventListener("click", () => {
  settings.disp = settings.disp === "both" ? "orig" : settings.disp === "orig" ? "pt" : "both";
  applySettings();
});
$("chipAudio").addEventListener("click", () => {
  settings.audio = settings.audio === "both" ? "pt" : settings.audio === "pt" ? "orig" : "both";
  applySettings();
  restartIfSpeaking();
});
function cycleRate(side){
  const key = side === "pt" ? "ratePt" : "rateOrig";
  const i = RATES.indexOf(settings[key]);
  settings[key] = RATES[(i + 1) % RATES.length];
  applySettings();
  // apply immediately if this language is the one sounding right now; otherwise it takes effect on the next phrase
  const cur = queue[qPos];
  if (state === "playing" && activeEngine === "google" && player && cur && cur.side === side)
    player.playbackRate = settings[key];
}
$("rateOrigBtn").addEventListener("click", () => cycleRate("orig"));
$("ratePtBtn").addEventListener("click", () => cycleRate("pt"));
$("chipEngine").addEventListener("click", () => {
  const order = ["el", "google", "device"];
  settings.engine = order[(order.indexOf(settings.engine) + 1) % order.length];
  if (settings.engine === "el"){
    elDown = false; // give ElevenLabs another chance
    if (!settings.elKey){ toast("Add your ElevenLabs API key below."); $("elKeyInput").focus(); }
  }
  if (settings.engine === "google") googleDown = false;
  applySettings();
  restartIfSpeaking();
});
$("elKeySave").addEventListener("click", async () => {
  settings.elKey = $("elKeyInput").value.trim();
  elDown = false;
  elVoicesLoaded = false;
  elCache.clear();
  saveSettings();
  if (!settings.elKey){ applySettings(); toast("ElevenLabs key removed."); return; }
  try{
    await loadElVoices();
    settings.engine = "el";
    applySettings();
    toast("ElevenLabs connected — " + $("elVoice").options.length + " voices available.");
    restartIfSpeaking();
  }catch(e){
    toast(/401/.test(e.message) ? "Invalid ElevenLabs API key." : "Could not reach ElevenLabs.", 4200);
  }
});
$("elVoice").addEventListener("change", () => {
  settings.elVoice = $("elVoice").value;
  saveSettings();
  restartIfSpeaking();
});
$("fontMinus").addEventListener("click", () => {
  settings.fs = Math.max(FS_MIN, Math.round((settings.fs - FS_STEP) * 10) / 10);
  applySettings();
});
$("fontPlus").addEventListener("click", () => {
  settings.fs = Math.min(FS_MAX, Math.round((settings.fs + FS_STEP) * 10) / 10);
  applySettings();
});
$("chipDark").addEventListener("click", () => {
  settings.theme = settings.theme === "dark" ? "" : "dark";
  applySettings();
});
$("chipLight").addEventListener("click", () => {
  settings.theme = settings.theme === "light" ? "" : "light";
  applySettings();
});
$("voice").addEventListener("change", restartIfSpeaking);

loadSettings();
applySettings();
if (settings.elKey) loadElVoices().catch(() => {});

if (synth){
  populateVoices();
  synth.addEventListener("voiceschanged", populateVoices);
}
</script>
</body>
</html>
