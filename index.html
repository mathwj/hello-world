<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Border Control — Booth 4</title>
<meta name="description" content="An interactive customs officer you can talk to." />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<main class="app">

  <!-- ───────────────────────── stage ───────────────────────── -->
  <section class="stage" id="stage" aria-label="Customs booth">
    <svg id="booth" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img"
         aria-label="A customs officer standing behind a counter">
      <title>Customs officer at booth 4</title>

      <defs>
        <!-- paper grain, laid over everything at the end -->
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="11" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer><feFuncA type="linear" slope="0.62" /></feComponentTransfer>
        </filter>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="16" />
        </filter>
      </defs>

      <!-- ── room ── -->
      <rect class="wall" x="0" y="0" width="400" height="255" />
      <ellipse class="wash" cx="96" cy="60" rx="185" ry="105" filter="url(#soft)" />
      <ellipse class="wash wash--cool" cx="340" cy="205" rx="140" ry="90" filter="url(#soft)" />
      <rect class="floor" x="0" y="248" width="400" height="52" />
      <line class="seam" x1="0" y1="248" x2="400" y2="248" />

      <!-- ── window onto the apron ── -->
      <g id="window">
        <rect class="pane-sky" x="286" y="72" width="68" height="45" />
        <rect class="pane-ground" x="286" y="117" width="68" height="22" />
        <line class="pane-horizon" x1="286" y1="117" x2="354" y2="117" />
        <line class="mast" x1="300" y1="128" x2="300" y2="101" />
        <rect class="mast-head" x="295" y="98" width="10" height="3.6" rx="1" />
        <g class="plane">
          <ellipse cx="325" cy="128" rx="15" ry="2.8" />
          <path d="M318 126 l4.5 -6.5 h2.6 l-2.6 6.5 z" />
          <rect x="315" y="128" width="13" height="2.2" rx="1" />
        </g>
        <rect class="pane-frame" x="286" y="72" width="68" height="67" />
        <rect class="sill" x="281" y="139" width="78" height="4" rx="1" />
      </g>

      <!-- ── officer ── -->
      <g id="officer">
        <g id="body">

          <!-- neck -->
          <path class="skin neck" d="M206 106 C205 128 204 146 203 163 L227 163 C225 146 224 128 223 106 Z" />

          <!-- torso -->
          <path class="shirt" d="M203 161 C185 165 174 174 170 187 L164 236 L266 236 L258 187
                                  C254 174 243 165 227 161 Z" />

          <!-- collar and tie -->
          <path class="shirt shirt--collar" d="M203 160 L215 180 L227 160 L222 157 L208 157 Z" />
          <path class="tie" d="M209 162 L221 162 L218 175 L223 220 L207 220 L212 175 Z" />

          <!-- pocket -->
          <path class="stitch" d="M231 190 h19 v17 h-19 z" />
          <line class="stitch" x1="231" y1="196" x2="250" y2="196" />

          <!-- shoulder boards -->
          <g class="epaulettes">
            <g transform="rotate(-14 188 173)">
              <rect class="epaulette" x="178" y="170" width="20" height="6" rx="1" />
              <line class="epaulette-stripe" x1="182" y1="170" x2="182" y2="176" />
              <line class="epaulette-stripe" x1="187" y1="170" x2="187" y2="176" />
            </g>
            <g transform="rotate(14 242 173)">
              <rect class="epaulette" x="232" y="170" width="20" height="6" rx="1" />
              <line class="epaulette-stripe" x1="243" y1="170" x2="243" y2="176" />
              <line class="epaulette-stripe" x1="248" y1="170" x2="248" y2="176" />
            </g>
          </g>

          <!-- the open hand: passport, please -->
          <g id="gesture-arm">
            <path class="limb-ink" d="M183 180 C173 182 163 186 157 190" />
            <path class="limb"     d="M183 180 C173 182 163 186 157 190" />
            <g class="fingers-ink">
              <path d="M146 183.5 C138 179.5 130 179 125 181" />
              <path d="M146 187 C137 184 129 184.5 124 187" />
              <path d="M146 190.5 C137 189 130 190 125 192.5" />
              <path d="M147 194 C142 196 137 199 134 202" />
            </g>
            <ellipse class="skin" cx="152" cy="189" rx="9.2" ry="6"
                     transform="rotate(-12 152 189)" />
            <g class="fingers">
              <path d="M146 183.5 C138 179.5 130 179 125 181" />
              <path d="M146 187 C137 184 129 184.5 124 187" />
              <path d="M146 190.5 C137 189 130 190 125 192.5" />
              <path d="M147 194 C142 196 137 199 134 202" />
            </g>
          </g>

          <g id="head-rig">
            <g id="head-look">

              <!-- hair sits proud of the face on the far side -->
              <ellipse class="hair" cx="215.6" cy="92" rx="18.8" ry="24.2" />
              <path class="hair" d="M228 68 C234 76 235 88 232 97 C233 85 231 74 226 68 Z" />

              <!-- head -->
              <ellipse class="skin head" cx="214" cy="92" rx="18" ry="24" />

              <!-- the nose, hanging past the silhouette -->
              <path class="skin nose" d="M205 90.5 C199 95 190 102 186 108
                                         C184 112 189 113 193 110
                                         C199 106 205 100 207 95 Z" />

              <!-- brows -->
              <g id="brows">
                <path class="brow" d="M205 76.5 C208 74 212 74 215 76.5" />
                <path class="brow" d="M220 75.5 C223 73.5 227 73.9 229 76" />
              </g>

              <!-- eyes -->
              <g id="eyes">
                <g class="eye">
                  <ellipse class="eye-white" cx="210" cy="83.5" rx="3.8" ry="3.1" />
                  <g class="pupil-rig">
                    <circle class="pupil" cx="210" cy="83.5" r="1.85" />
                  </g>
                </g>
                <g class="eye">
                  <ellipse class="eye-white" cx="224" cy="83" rx="3.8" ry="3.1" />
                  <g class="pupil-rig">
                    <circle class="pupil" cx="224" cy="83" r="1.85" />
                  </g>
                </g>
              </g>

              <ellipse class="blush" cx="228" cy="96" rx="6" ry="4" />

              <!-- mouth (rebuilt every frame by officer.js) -->
              <path id="mouth" d="M207 103 Q213 102 219 103 Q213 105 207 103 Z" />

              <!-- peaked cap -->
              <g id="cap">
                <path class="cap-crown" d="M194 64 C191 46 201 38 214 38 C228 38 239 47 236 64 Z" />
                <path class="cap-band"  d="M193 61 C200 65 231 65 237 61 L237 69 C230 73 200 73 193 69 Z" />
                <ellipse class="cap-brim" cx="206" cy="70" rx="31" ry="4.8"
                         transform="rotate(-4 206 70)" />
                <path class="cap-badge" d="M203 47 l6 -2.4 l6 2.4 v5 c0 3.6 -3 5.4 -6 6.6
                                           c-3 -1.2 -6 -3 -6 -6.6 z" />
              </g>

            </g>
          </g>
        </g>
      </g>

      <!-- ── screen on the counter ── -->
      <g id="screen">
        <rect class="screen-glass" x="62" y="122" width="52" height="82" />
        <line class="screen-glint" x1="70" y1="198" x2="106" y2="132" />
        <rect class="screen-frame" x="62" y="122" width="52" height="82" />
        <rect class="screen-post" x="59" y="120" width="5" height="84" rx="1" />
      </g>

      <!-- ── counter ── -->
      <g id="counter">
        <rect class="counter-top" x="26" y="200" width="306" height="11" />
        <rect class="counter-face" x="26" y="211" width="306" height="89" />
        <line class="counter-edge" x1="26" y1="200" x2="332" y2="200" />
        <line class="counter-edge" x1="26" y1="211" x2="332" y2="211" />
        <line class="counter-edge" x1="332" y1="200" x2="332" y2="300" />
        <line class="counter-edge" x1="26"  y1="200" x2="26"  y2="300" />

        <!-- passport -->
        <g id="passport" transform="rotate(-4 284 198)">
          <rect class="passport-cover" x="262" y="188" width="44" height="21" rx="2" />
          <circle class="passport-mark" cx="284" cy="195" r="4.2" />
          <rect class="passport-mark" x="274" y="202" width="20" height="1.6" rx="0.8" />
          <g id="stamp-mark">
            <rect x="266" y="189" width="37" height="14" rx="1.5" />
            <text x="284.5" y="198.5">CLEARED</text>
          </g>
        </g>
      </g>

      <!-- ── the other hand: resting, then stamping ──
           Both live outside #counter so the fingers fall over its edge. -->
      <g id="rest-arm">
        <path class="limb-ink" d="M251 178 C258 184 260 191 260 197" />
        <path class="limb"     d="M251 178 C258 184 260 191 260 197" />
        <ellipse class="skin" cx="259" cy="199" rx="9" ry="5.4" />
        <g class="fingers-ink">
          <path d="M252 202 C251 205 251 207 252 209" />
          <path d="M257 203 C256 206 256 208 257 210" />
          <path d="M262 203 C262 206 262 208 263 210" />
          <path d="M267 202 C268 204 268 206 268 208" />
        </g>
        <g class="fingers">
          <path d="M252 202 C251 205 251 207 252 209" />
          <path d="M257 203 C256 206 256 208 257 210" />
          <path d="M262 203 C262 206 262 208 263 210" />
          <path d="M267 202 C268 204 268 206 268 208" />
        </g>
      </g>

      <g id="stamp-arm">
        <path class="limb-ink" d="M251 178 C262 181 272 186 278 191" />
        <path class="limb"     d="M251 178 C262 181 272 186 278 191" />
        <rect class="stamp-body" x="276" y="180" width="12" height="14" rx="2" />
        <rect class="stamp-head" x="272" y="194" width="20" height="6" rx="1.5" />
        <ellipse class="skin" cx="282" cy="185" rx="8.5" ry="6.4" />
      </g>

      <!-- paper -->
      <rect class="grain" x="0" y="0" width="400" height="300" filter="url(#grain)" />
    </svg>

    <div class="stage-hud">
      <span class="hud-dot" id="hud-dot"></span>
      <span id="hud-text">BOOTH 4 · LANE B · OPEN</span>
    </div>
  </section>

  <!-- ───────────────────────── conversation ───────────────────────── -->
  <section class="panel">
    <header class="panel-head">
      <div>
        <h1>Border Control</h1>
        <p id="panel-sub">Officer M. Vance · Badge 4417</p>
      </div>
    </header>

    <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions"></div>

    <div class="composer">
      <!-- what to say, once you have hesitated long enough -->
      <div class="cue" id="cue" hidden>
        <span class="cue-label" id="cue-label">Try saying</span>
        <p class="cue-line" id="cue-line"></p>
      </div>

      <div class="chips" id="chips"></div>

      <div class="listen-row">
        <button type="button" id="mic" class="mic" aria-label="Answer out loud">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0" />
            <line x1="12" y1="18" x2="12" y2="21" />
          </svg>
        </button>
        <span class="listen-state" id="listen-state">Step up to the counter</span>
      </div>
    </div>
  </section>

  <!-- ───────────────────────── gate ─────────────────────────
       Speaking and listening both need a user gesture, so the
       interview starts on a click. -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <p class="gate-kicker">Booth 4 · Lane B</p>
      <h2>The officer will speak to you.</h2>
      <p class="gate-copy">
        This one is spoken, not typed. He asks, the microphone opens, you answer
        out loud. Hesitate and he will show you what to say — then say it.
      </p>
      <button type="button" id="gate-start" class="gate-btn">Step up to the counter</button>
      <p class="gate-note" id="gate-note"></p>
    </div>
  </div>
</main>

<script src="js/officer.js"></script>
<script src="js/voice.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/app.js"></script>
</body>
</html>
