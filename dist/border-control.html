<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Border Control — Booth 4</title>
<meta name="description" content="An interactive customs officer you can talk to." />
<style>
/* ─────────────────────────────────────────────────────────────
   Border Control — minimal customs booth
   ───────────────────────────────────────────────────────────── */

:root {
  --bg:            #ded5c0;
  --panel:         #f4efe2;
  --panel-2:       #ebe4d2;
  --line:          #d5cab1;
  --ink:           #35312a;
  --ink-dim:       #7d7462;
  --accent:        #4bb8d8;
  --accent-soft:   #1c7e9c;
  --green:         #5d8a5f;
  --red:           #b0685b;

  --wall:          #efe9db;
  --wall-warm:     #e6dcc6;
  --floor:         #ded3b8;
  --counter:       #f0ebdd;
  --counter-top:   #f7f3e8;
  --shirt:         #5cc6e4;
  --shirt-dark:    #43b0d2;
  --black:         #26241f;
  --skin:          #e9b78e;
  --skin-line:     #6a5340;

  --radius: 12px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

/* Author `display` rules outrank the UA's [hidden] rule, and .mic and
   .gate both set one — without this, hiding them does nothing. */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
}

/* ── stage ─────────────────────────────────────────────────── */

.stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--wall);
  overflow: hidden;
}

#booth {
  width: 100%;
  height: 100%;
  display: block;
}

.stage-hud {
  position: absolute;
  left: 18px;
  bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--ink-dim);
  background: rgba(255, 252, 244, 0.78);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 12px;
  backdrop-filter: blur(4px);
}

.hud-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: none;
  animation: pulse 3.2s ease-in-out infinite;
}
.hud-dot.busy   { background: var(--accent); }
.hud-dot.closed { background: var(--red); }
.hud-dot.live   { background: var(--accent); animation-duration: 1.1s; }

/* ── booth artwork ─────────────────────────────────────────── */

/* Painted flat colour with a thin, warm charcoal line — the whole
   scene is stroked in --ink at a hair over 1px. */

.wall  { fill: var(--wall); }
.floor { fill: var(--floor); }
.seam  { stroke: var(--ink); stroke-width: 1; opacity: .45; }

/* uneven brushwork on the plaster */
.wash        { fill: var(--wall-warm); opacity: .3; }
.wash--cool  { fill: #e6e6db; opacity: .3; }

.pane-sky     { fill: #cfdfe3; }
.pane-ground  { fill: #b9b3a4; }
.pane-horizon { stroke: var(--ink); stroke-width: .8; opacity: .35; }
.pane-frame   { fill: none; stroke: var(--ink); stroke-width: 1.2; opacity: .85; }
.sill         { fill: var(--counter-top); stroke: var(--ink); stroke-width: 1; }
.mast         { stroke: var(--ink); stroke-width: 1; opacity: .5; }
.mast-head    { fill: var(--ink); opacity: .5; }
.plane        { fill: #918b7e; }

.screen-glass { fill: #dde6e2; opacity: .4; }
.screen-frame { fill: none; stroke: var(--ink); stroke-width: 1.1; opacity: .8; }
.screen-post  { fill: #cdd5d2; stroke: var(--ink); stroke-width: 1.1; }
.screen-glint { stroke: #ffffff; stroke-width: 5; opacity: .35; }

.counter-top  { fill: var(--counter-top); }
.counter-face { fill: var(--counter); }
.counter-edge { stroke: var(--ink); stroke-width: 1.1; opacity: .7; }

/* the officer */
.skin       { fill: var(--skin); stroke: var(--skin-line); stroke-width: 1.1;
              stroke-linejoin: round; }
.neck       { stroke-width: 1; }
.nose       { stroke-width: 1.1; }
.hair       { fill: #2f2a24; }
.blush      { fill: #dd9074; opacity: .35; }

.shirt          { fill: var(--shirt); stroke: var(--ink); stroke-width: 1.2;
                  stroke-linejoin: round; }
.shirt--collar  { fill: var(--shirt-dark); }
.tie            { fill: var(--black); stroke: var(--ink); stroke-width: .9; }
.stitch         { fill: none; stroke: var(--ink); stroke-width: .9; opacity: .55; }
.epaulette        { fill: var(--black); }
.epaulette-stripe { stroke: #f3efe4; stroke-width: 1.6; }

.limb      { fill: none; stroke: var(--shirt); stroke-width: 10.6; stroke-linecap: round; }
.limb-ink  { fill: none; stroke: var(--ink);   stroke-width: 12.8; stroke-linecap: round; }
.fingers     { fill: none; stroke: var(--skin);      stroke-width: 3.2; stroke-linecap: round; }
.fingers-ink { fill: none; stroke: var(--skin-line); stroke-width: 4.6; stroke-linecap: round; }

.eye-white { fill: #fbf8ef; stroke: var(--ink); stroke-width: .8; }
.pupil     { fill: #2b2721; }
.brow      { fill: none; stroke: #3a3128; stroke-width: 1.8; stroke-linecap: round; }
#mouth     { fill: #6d4136; stroke: #6d4136; stroke-width: .6; }

.cap-crown { fill: #f7f3e8; stroke: var(--ink); stroke-width: 1.2; }
.cap-band  { fill: var(--black); }
.cap-brim  { fill: var(--black); }
.cap-badge { fill: #f7f3e8; stroke: var(--ink); stroke-width: .9; }

.passport-cover { fill: #8f5a55; stroke: var(--ink); stroke-width: 1.1; }
.passport-mark  { fill: #e7c98f; }

.stamp-body { fill: var(--black); }
.stamp-head { fill: #8b8375; stroke: var(--ink); stroke-width: .9; }

/* paper grain over the whole picture */
.grain {
  mix-blend-mode: multiply;
  opacity: .16;
  pointer-events: none;
}

#stamp-mark {
  opacity: 0;
  transform-box: view-box;
  transform-origin: 284px 196px;
}
#stamp-mark rect {
  fill: none; stroke: var(--green); stroke-width: 1.8;
}
#stamp-mark text {
  fill: var(--green); font-family: var(--mono); font-size: 7px;
  letter-spacing: .04em; text-anchor: middle;
}
#stamp-mark.denied rect { stroke: var(--red); }
#stamp-mark.denied text { fill: var(--red); }
#stamp-mark.on { animation: stampIn .45s cubic-bezier(.2,1.5,.4,1) forwards; }

/* ── rigging / motion ──────────────────────────────────────── */

#body {
  transform-box: view-box;
  transform-origin: 214px 236px;
  animation: breathe 4.4s ease-in-out infinite;
}

#head-rig {
  transform-box: view-box;
  transform-origin: 214px 160px;
  animation: sway 7.3s ease-in-out infinite;
}

#head-look {
  transform-box: view-box;
  transform-origin: 214px 160px;
  will-change: transform;
}

.pupil-rig { transform-box: view-box; will-change: transform; }

#eyes .eye {
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 80ms ease-out;
}
#officer.blink .eye { transform: scaleY(.08); }

/* moods — small offsets, read clearly at a glance */
#brows { transform-box: view-box; transform-origin: 211px 78px;
         transition: transform 260ms ease-out; }
#officer.mood-suspicious #brows { transform: translateY(2.4px) rotate(-1deg); }
#officer.mood-friendly   #brows { transform: translateY(-1.8px); }
#officer.mood-suspicious #eyes .eye { transform: scaleY(.72); }
#officer.blink.mood-suspicious #eyes .eye { transform: scaleY(.08); }

/* The resting hand breathes with the body it is attached to. */
#rest-arm {
  transform-box: view-box;
  transform-origin: 214px 236px;
  animation: breathe 4.4s ease-in-out infinite;
  transition: opacity 200ms ease;
}
#officer.stamping ~ #rest-arm,
#rest-arm.away { opacity: 0; }

#stamp-arm {
  transform-box: view-box;
  transform-origin: 251px 178px;   /* the shoulder */
  transform: rotate(-34deg);
  opacity: 0;
}
#stamp-arm.stamping { animation: stampSwing 1.5s cubic-bezier(.4,0,.2,1) forwards; }

#counter { transform-box: view-box; }
#counter.jolt { animation: jolt .22s ease-out; }

@keyframes breathe {
  0%, 100% { transform: translateY(0)      scaleY(1);     }
  45%      { transform: translateY(-1.3px) scaleY(1.014); }
}

@keyframes sway {
  0%, 100% { transform: rotate(-1.1deg) translateX(-.6px); }
  50%      { transform: rotate(1.2deg)  translateX(.6px);  }
}

@keyframes pulse {
  0%, 100% { opacity: .35; }
  50%      { opacity: 1;   }
}

@keyframes stampIn {
  0%   { opacity: 0; transform: scale(2.1) rotate(-14deg); }
  60%  { opacity: 1; transform: scale(.94) rotate(-4deg);  }
  100% { opacity: 1; transform: scale(1)   rotate(-3deg);  }
}

@keyframes stampSwing {
  0%   { opacity: 0; transform: rotate(-34deg); }
  12%  { opacity: 1; transform: rotate(-26deg); }
  42%  { opacity: 1; transform: rotate(-36deg); }   /* wind up */
  56%  { opacity: 1; transform: rotate(3deg);   }   /* thud */
  66%  { opacity: 1; transform: rotate(-1deg);  }
  86%  { opacity: 1; transform: rotate(-22deg); }
  100% { opacity: 0; transform: rotate(-34deg); }
}

@keyframes jolt {
  0%, 100% { transform: translateY(0); }
  40%      { transform: translateY(1.6px); }
}

/* ── conversation panel ────────────────────────────────────── */

.panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border-left: 1px solid var(--line);
}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 20px 22px 16px;
  border-bottom: 1px solid var(--line);
}

.panel-head h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.panel-head p {
  margin: 6px 0 0;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--ink-dim);
}

.log {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}

.msg {
  max-width: 88%;
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 14.5px;
  line-height: 1.5;
  animation: rise .32s ease-out both;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.msg.officer {
  align-self: flex-start;
  background: #fdfaf1;
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
}

.msg.you {
  align-self: flex-end;
  background: #bfe6f2;
  color: var(--ink);
  border: 1px solid #9fd2e4;
  border-bottom-right-radius: 4px;
}

.msg.note {
  align-self: center;
  max-width: 100%;
  background: none;
  border: none;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-dim);
  padding: 2px 0;
}
.msg.note.pass { color: var(--green); }
.msg.note.fail { color: var(--red); }

/* what the microphone thinks it is hearing, so far */
.msg.you.interim {
  background: none;
  border: 1px dashed #9fc4d2;
  color: var(--ink-dim);
  font-style: italic;
}

.caret::after {
  content: "▍";
  color: var(--accent-soft);
  animation: caret .9s steps(1) infinite;
}

@keyframes caret { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }

@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

/* ── composer ──────────────────────────────────────────────── */

.composer {
  border-top: 1px solid var(--line);
  padding: 16px 22px 20px;
}
.composer.locked { opacity: .45; pointer-events: none; }

/* the line to say, once you have hesitated long enough */

.cue { text-align: center; margin-bottom: 14px; }

.cue-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.cue-line {
  margin: 6px 0 0;
  font-size: 19px;
  line-height: 1.4;
  color: var(--accent-soft);
}

.cue.pop { animation: cueIn .34s cubic-bezier(.2,1.3,.4,1) both; }

@keyframes cueIn {
  from { opacity: 0; transform: translateY(7px) scale(.97); }
  to   { opacity: 1; transform: none; }
}

/* ── listening ─────────────────────────────────────────────── */

.listen-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

.listen-state {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.mic {
  flex: none;
  width: 54px;
  height: 54px;
  padding: 0;
  display: grid;
  place-items: center;
  color: var(--ink-dim);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  transition: color 160ms, border-color 160ms, background 160ms;
}
.mic svg {
  width: 24px; height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
}
.mic svg rect { fill: currentColor; stroke: none; }
.mic:hover { color: var(--ink); border-color: var(--ink-dim); }
.mic:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 3px; }
.mic[disabled], .mic.dead { opacity: .35; cursor: default; }

.mic.listening {
  color: #10333d;
  background: var(--accent);
  border-color: var(--accent);
  animation: micPulse 1.5s ease-out infinite;
}

@keyframes micPulse {
  0%   { box-shadow: 0 0 0 0 rgba(75, 184, 216, .55); }
  70%  { box-shadow: 0 0 0 14px rgba(75, 184, 216, 0); }
  100% { box-shadow: 0 0 0 0 rgba(75, 184, 216, 0); }
}

/* answers you can pick — only when this browser cannot listen */

.chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-bottom: 14px;
}
.chips:empty { margin-bottom: 0; }

.chip {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
  transition: background 140ms, border-color 140ms, transform 140ms;
  animation: rise .26s ease-out both;
}
.chip:hover { background: #fdfaf1; border-color: var(--ink-dim); transform: translateY(-1px); }
.chip:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
.chip.primary { border-color: var(--accent-soft); color: var(--accent-soft); }

/* ── gate ──────────────────────────────────────────────────── */

.gate {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(239, 233, 219, .74);
  backdrop-filter: blur(7px);
  z-index: 10;
  transition: opacity 380ms ease, visibility 380ms;
}
.gate.open { opacity: 0; visibility: hidden; }

.gate-card {
  max-width: 420px;
  text-align: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 30px 30px 26px;
  animation: rise .4s ease-out both;
}

.gate-kicker {
  margin: 0 0 12px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .18em;
  color: var(--accent);
}
.gate-card h2 {
  margin: 0 0 10px;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
}
.gate-copy {
  margin: 0 0 22px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink-dim);
}

.gate-btn {
  font: inherit;
  font-size: 15px;
  width: 100%;
  color: #10333d;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  cursor: pointer;
  transition: opacity 140ms, transform 140ms;
}
.gate-btn:hover { transform: translateY(-1px); }
.gate-btn[disabled] { opacity: .6; transform: none; cursor: default; }

.gate-link {
  font: inherit;
  font-size: 13px;
  margin-top: 12px;
  color: var(--ink-dim);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.gate-link:hover { color: var(--ink); }

.gate-note {
  margin: 16px 0 0;
  min-height: 1em;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.6;
  color: #9a6b3f;
}

.gate-btn:focus-visible,
.gate-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ── responsive ────────────────────────────────────────────── */

@media (max-width: 880px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(200px, 38vh) minmax(0, 1fr);
  }
  .panel { border-left: none; border-top: 1px solid var(--line); }
  .panel-head { padding: 14px 18px 12px; }
  .log { padding: 16px 18px; }
  .composer { padding: 12px 18px 16px; }
  .stage-hud { left: 12px; bottom: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  #body, #head-rig, .lamp-glow, .sign-lamp, .hud-dot, #status-light,
  #stamp-arm.stamping, #stamp-mark.on, #counter.jolt {
    animation: none;
  }
  .msg, .chip, .cue.pop, .gate-card, .mic.listening { animation: none; }
  .mic.listening { box-shadow: 0 0 0 3px rgba(75, 184, 216, .45); }
  .log { scroll-behavior: auto; }
  #stamp-mark.on { opacity: 1; }
}
</style>
</head>
<body>

<main class="app">

  <!-- ───────────────────────── stage ───────────────────────── -->
  <section class="stage" id="stage" aria-label="Customs booth">
    <svg id="booth" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img"
         aria-label="A customs officer standing behind a counter">
      <title>Customs officer at booth 4</title>

      <defs>
        <!-- paper grain, laid over everything at the end -->
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="11" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer><feFuncA type="linear" slope="0.62" /></feComponentTransfer>
        </filter>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="16" />
        </filter>
      </defs>

      <!-- ── room ── -->
      <rect class="wall" x="0" y="0" width="400" height="255" />
      <ellipse class="wash" cx="96" cy="60" rx="185" ry="105" filter="url(#soft)" />
      <ellipse class="wash wash--cool" cx="340" cy="205" rx="140" ry="90" filter="url(#soft)" />
      <rect class="floor" x="0" y="248" width="400" height="52" />
      <line class="seam" x1="0" y1="248" x2="400" y2="248" />

      <!-- ── window onto the apron ── -->
      <g id="window">
        <rect class="pane-sky" x="286" y="72" width="68" height="45" />
        <rect class="pane-ground" x="286" y="117" width="68" height="22" />
        <line class="pane-horizon" x1="286" y1="117" x2="354" y2="117" />
        <line class="mast" x1="300" y1="128" x2="300" y2="101" />
        <rect class="mast-head" x="295" y="98" width="10" height="3.6" rx="1" />
        <g class="plane">
          <ellipse cx="325" cy="128" rx="15" ry="2.8" />
          <path d="M318 126 l4.5 -6.5 h2.6 l-2.6 6.5 z" />
          <rect x="315" y="128" width="13" height="2.2" rx="1" />
        </g>
        <rect class="pane-frame" x="286" y="72" width="68" height="67" />
        <rect class="sill" x="281" y="139" width="78" height="4" rx="1" />
      </g>

      <!-- ── officer ── -->
      <g id="officer">
        <g id="body">

          <!-- neck -->
          <path class="skin neck" d="M206 106 C205 128 204 146 203 163 L227 163 C225 146 224 128 223 106 Z" />

          <!-- torso -->
          <path class="shirt" d="M203 161 C185 165 174 174 170 187 L164 236 L266 236 L258 187
                                  C254 174 243 165 227 161 Z" />

          <!-- collar and tie -->
          <path class="shirt shirt--collar" d="M203 160 L215 180 L227 160 L222 157 L208 157 Z" />
          <path class="tie" d="M209 162 L221 162 L218 175 L223 220 L207 220 L212 175 Z" />

          <!-- pocket -->
          <path class="stitch" d="M231 190 h19 v17 h-19 z" />
          <line class="stitch" x1="231" y1="196" x2="250" y2="196" />

          <!-- shoulder boards -->
          <g class="epaulettes">
            <g transform="rotate(-14 188 173)">
              <rect class="epaulette" x="178" y="170" width="20" height="6" rx="1" />
              <line class="epaulette-stripe" x1="182" y1="170" x2="182" y2="176" />
              <line class="epaulette-stripe" x1="187" y1="170" x2="187" y2="176" />
            </g>
            <g transform="rotate(14 242 173)">

<script>
/* ─────────────────────────────────────────────────────────────
   officer.js — the puppet.
   Owns everything that moves: breathing is CSS, but blinking,
   gaze, mouth shapes and the stamp are driven from here.
   ───────────────────────────────────────────────────────────── */

const Officer = (() => {

  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // mouth anchor, in viewBox units — under the nose, on a small face
  const MX = 211, MY = 106;

  const MOODS = {
    neutral:    { curve:  0.15, rest: 0.00 },
    friendly:   { curve:  0.60, rest: 0.02 },
    suspicious: { curve: -0.40, rest: 0.00 },
    stern:      { curve: -0.15, rest: 0.00 }
  };

  const el = {};
  const state = {
    mood: 'neutral',
    open: 0, openTarget: 0,     // jaw
    wide: 0, wideTarget: 0,     // lip spread
    gx: 0, gy: 0,               // current gaze, -1..1
    tgx: 0, tgy: 0,             // gaze target
    speaking: false,
    pointerAt: 0,
    nextIdleGaze: 0,
    nextBlink: 0
  };

  /* ── mouth geometry ──────────────────────────────────────── */

  // A lens shape: two quadratics between the mouth corners.
  // `open` drives the gap, `wide` stretches it, `curve` lifts the corners.
  function mouthPath(open, wide, curve) {
    const w = 5.6 + wide * 2.1;
    const h = Math.max(open * 5.4, 0.5);
    const c = curve * 2.2;
    const lx = MX - w, rx = MX + w, cy = MY - c;
    const upper = MY - h * 0.55;
    const lower = MY + h * 0.55 + 1.35;
    return `M ${lx} ${cy} Q ${MX} ${upper} ${rx} ${cy} Q ${MX} ${lower} ${lx} ${cy} Z`;
  }

  // Rough visemes. Not phonetics — just enough variation that the
  // face reads as talking instead of flapping.
  function visemeFor(ch) {
    const c = ch.toLowerCase();
    if ('aáà'.includes(c))            return { open: 0.95, wide: 0.55 };
    if ('oôu'.includes(c))            return { open: 0.80, wide: 0.00 };
    if ('eéi'.includes(c))            return { open: 0.55, wide: 0.90 };
    if ('yw'.includes(c))             return { open: 0.45, wide: 0.30 };
    if ('mbp'.includes(c))            return { open: 0.05, wide: 0.35 };
    if ('fv'.includes(c))             return { open: 0.18, wide: 0.55 };
    if ('szc'.includes(c))            return { open: 0.22, wide: 0.75 };
    if (' \n\t'.includes(c))          return { open: 0.06, wide: 0.15 };
    if ('.,!?;:—'.includes(c))        return { open: 0.02, wide: 0.10 };
    return { open: 0.42, wide: 0.45 };
  }

  /* ── frame loop ──────────────────────────────────────────── */

  function tick(now) {
    // gaze: follow the pointer when it is fresh, otherwise drift
    if (now - state.pointerAt > 2600 && now > state.nextIdleGaze) {
      state.tgx = (Math.random() * 2 - 1) * 0.55;
      state.tgy = (Math.random() * 2 - 1) * 0.35;
      state.nextIdleGaze = now + 1800 + Math.random() * 3200;
    }

    const ease = 0.07;
    state.gx += (state.tgx - state.gx) * ease;
    state.gy += (state.tgy - state.gy) * ease;

    el.headLook.style.transform =
      `translate(${state.gx * 2.2}px, ${state.gy * 1.4}px) rotate(${state.gx * 2.4}deg)`;
    el.pupils.forEach(p => {
      p.style.transform = `translate(${state.gx * 1.9}px, ${state.gy * 1.3}px)`;
    });

    // jaw: chase the current viseme, with a little tremor while voiced
    const snap = state.speaking ? 0.34 : 0.16;
    state.open += (state.openTarget - state.open) * snap;
    state.wide += (state.wideTarget - state.wide) * snap;

    const mood = MOODS[state.mood] || MOODS.neutral;
    const jitter = state.speaking ? (Math.random() - 0.5) * 0.06 : 0;
    el.mouth.setAttribute('d',
      mouthPath(Math.max(0, state.open + jitter + mood.rest), state.wide, mood.curve));

    // blink: mostly singles, sometimes a quick double
    if (now > state.nextBlink) {
      blink();
      state.nextBlink = now + (Math.random() < 0.18 ? 260 : 2200 + Math.random() * 4200);
    }

    requestAnimationFrame(tick);
  }

  function blink() {
    el.officer.classList.add('blink');
    setTimeout(() => el.officer.classList.remove('blink'), 95);
  }

  /* ── public API ──────────────────────────────────────────── */

  function init() {
    el.officer  = document.getElementById('officer');
    el.headLook = document.getElementById('head-look');
    el.mouth    = document.getElementById('mouth');
    el.pupils   = [...document.querySelectorAll('.pupil-rig')];
    el.arm      = document.getElementById('stamp-arm');
    el.restArm  = document.getElementById('rest-arm');
    el.stamp    = document.getElementById('stamp-mark');
    el.counter  = document.getElementById('counter');
    el.stage    = document.getElementById('stage');

    el.stage.addEventListener('pointermove', e => {
      const r = el.stage.getBoundingClientRect();
      state.tgx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width  - 0.5) * 2));
      state.tgy = Math.max(-1, Math.min(1, ((e.clientY - r.top)  / r.height - 0.42) * 2));
      state.pointerAt = performance.now();
    });

    setMood('neutral');
    requestAnimationFrame(tick);
  }

  function setMood(name) {
    state.mood = MOODS[name] ? name : 'neutral';
    el.officer.classList.remove('mood-neutral', 'mood-friendly', 'mood-suspicious', 'mood-stern');
    el.officer.classList.add('mood-' + state.mood);
  }

  function lookAt(where) {
    if (where === 'passport') { state.tgx = 0.85; state.tgy = 0.8; }
    else                      { state.tgx = 0;   state.tgy = 0;    }
    state.pointerAt = performance.now();   // hold it for a beat
  }

  /* ── mouth control, for whoever is doing the talking ─────── */

  function beginSpeech() { state.speaking = true; }

  function shape(ch) {
    const v = visemeFor(ch);
    state.openTarget = v.open;
    state.wideTarget = v.wide;
  }

  function endSpeech() {
    state.speaking = false;
    state.openTarget = 0;
    state.wideTarget = 0;
  }

  // Types `text` out, moving the mouth in step with it. Used when the
  // officer has no voice — with speech synthesis, voice.js drives the
  // same three functions from the utterance instead.
  // `onChar` receives the text so far so the caller can render a bubble.
  function speak(text, onChar) {
    return new Promise(resolve => {
      beginSpeech();
      let i = 0;

      const step = () => {
        if (i >= text.length) {
          endSpeech();
          return resolve();
        }

        const ch = text[i++];
        shape(ch);
        onChar(text.slice(0, i));

        let delay = REDUCED ? 4 : 26 + Math.random() * 18;
        if (',;:'.includes(ch)) delay += REDUCED ? 20 : 190;
        if ('.!?'.includes(ch)) delay += REDUCED ? 30 : 330;
        setTimeout(step, delay);
      };

      step();
    });
  }

  function pause(ms) {
    return new Promise(r => setTimeout(r, REDUCED ? Math.min(ms, 120) : ms));
  }

  // Reaches for the stamp, brings it down, leaves a mark.
  async function stamp(approved) {
    lookAt('passport');
    el.stamp.classList.toggle('denied', !approved);
    el.stamp.querySelector('text').textContent = approved ? 'CLEARED' : 'HOLD';

    // hand off from the hand resting on the counter to the one holding
    // the stamp, so there are never two right arms
    el.restArm.classList.add('away');
    el.arm.classList.remove('stamping');
    void el.arm.offsetWidth;               // restart the animation
    el.arm.classList.add('stamping');

    await pause(830);                      // impact
    el.counter.classList.add('jolt');
    el.stamp.classList.add('on');
    setTimeout(() => el.counter.classList.remove('jolt'), 240);

    await pause(760);
    el.restArm.classList.remove('away');
    await pause(220);
    lookAt('traveler');
  }

  function reset() {
    el.stamp.classList.remove('on', 'denied');
    el.arm.classList.remove('stamping');
    el.restArm.classList.remove('away');
    setMood('neutral');
    lookAt('traveler');
  }

  return { init, speak, beginSpeech, shape, endSpeech,
           pause, setMood, lookAt, stamp, reset, blink, REDUCED };
})();
</script>
<script>
/* ─────────────────────────────────────────────────────────────
   voice.js — the officer's voice, and your microphone.

   Output is speechSynthesis; the caption and the mouth are driven
   from the utterance itself (boundary events where the browser
   fires them, a learned chars-per-second estimate where it does
   not), so the lips match what you actually hear.

   Input is SpeechRecognition — Chrome, Edge and Safari only, and
   only on a secure origin. Where it is missing the caller falls back
   to pickable answers; there is no typing.
   ───────────────────────────────────────────────────────────── */

const Voice = (() => {

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const TTS = 'speechSynthesis' in window;

  const support = { speak: TTS, listen: !!SR };

  let voice = null;         // chosen SpeechSynthesisVoice
  let recogniser = null;    // live SpeechRecognition, if any
  let listening = false;
  let aborting = false;     // did *we* stop it, or did the browser?

  /* ── picking a voice ─────────────────────────────────────── */

  // Nothing is guaranteed here: the voice list differs per OS and
  // loads asynchronously. Prefer something deep and English, then
  // settle for whatever English exists.
  const PREFERRED = [
    'google uk english male', 'daniel', 'microsoft guy', 'microsoft david',
    'alex', 'fred', 'google us english', 'microsoft mark'
  ];

  function pickVoice() {
    if (voice) return voice;
    const all = speechSynthesis.getVoices();
    if (!all.length) return null;

    for (const want of PREFERRED) {
      const hit = all.find(v => v.name.toLowerCase().includes(want));
      if (hit) return (voice = hit);
    }
    return (voice = all.find(v => /^en/i.test(v.lang)) || all[0]);
  }

  if (TTS) {
    speechSynthesis.getVoices();
    speechSynthesis.addEventListener?.('voiceschanged', () => { voice = null; pickVoice(); });
  }

  /* ── unlocking (needs a user gesture) ────────────────────── */

  // Browsers want a click before they will speak, and the mic needs
  // one permission prompt. Do both from the same gesture.
  async function unlock() {
    const out = { speak: false, listen: false, reason: '' };

    if (TTS) {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        speechSynthesis.speak(u);
        pickVoice();
        out.speak = true;
      } catch { /* stay silent, keep typing */ }
    }

    if (SR && navigator.mediaDevices?.getUserMedia) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());   // we only wanted the permission
        out.listen = true;
      } catch (err) {
        out.reason = err && err.name === 'NotAllowedError'
          ? (location.protocol === 'file:'
              ? 'The microphone is blocked on file:// — serve the page over http://localhost to talk.'
              : 'Microphone permission was declined.')
          : 'No microphone available.';
      }
    } else {
      out.reason = SR
        ? 'This browser will not hand over a microphone here.'
        : 'This browser has no speech recognition — Chrome, Edge or Safari do.';
    }

    return out;
  }

  /* ── speaking ────────────────────────────────────────────── */

  // Resolves true once the line has been spoken, false if the
  // browser refused — the caller then falls back to typing it out.
  function speak(text, onProgress) {
    if (!TTS) return Promise.resolve(false);

    return new Promise(resolve => {
      let settled = false;
      const finish = ok => {
        if (settled) return;
        settled = true;
        clearInterval(timer);
        clearTimeout(watchdog);
        Officer.endSpeech();
        if (ok) onProgress(text);
        resolve(ok);
      };

      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice();
      if (v) u.voice = v;
      u.rate = 0.97;
      u.pitch = 0.82;      // he is not a cheerful man

      let started = 0;
      let cursor = 0;      // characters revealed so far
      let anchor = 0;      // last position the browser confirmed
      let anchorAt = 0;
      let cps = 14.5;      // chars per second, corrected as we go
      let timer = null;

      const tick = () => {
        const est = anchor + ((performance.now() - anchorAt) / 1000) * cps;
        cursor = Math.min(text.length, Math.max(cursor, est));
        const shown = Math.floor(cursor);
        onProgress(text.slice(0, shown));
        Officer.shape(text[Math.min(shown, text.length - 1)] || ' ');
      };

      u.onstart = () => {
        started = anchorAt = performance.now();
        Officer.beginSpeech();
        timer = setInterval(tick, 55);
      };

      // Chrome reports word boundaries; use them to re-anchor the
      // caption and to learn this voice's real speaking rate.
      u.onboundary = e => {
        if (typeof e.charIndex !== 'number') return;
        const elapsed = (performance.now() - started) / 1000;
        if (elapsed > 0.4 && e.charIndex > 6) cps = e.charIndex / elapsed;
        anchor = Math.max(anchor, e.charIndex);
        anchorAt = performance.now();
      };

      u.onend = () => finish(true);
      u.onerror = () => finish(false);

      // If onstart never arrives the utterance was swallowed.
      const watchdog = setTimeout(() => { if (!started) finish(false); }, 1400);

      try {
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      } catch { finish(false); }
    });
  }

  function shutUp() {
    if (TTS) { try { speechSynthesis.cancel(); } catch { /* ignore */ } }
  }

  /* ── listening ───────────────────────────────────────────── */

  // Resolves { transcript } on speech, or { error } — 'no-speech',
  // 'not-allowed', 'aborted', 'network', 'unsupported'.
  // `onSpeech` fires the moment a voice is detected, before any words
  // are recognised, so the caller can stop prompting.
  function listen(onInterim, onSpeech) {
    if (!SR) return Promise.resolve({ error: 'unsupported' });

    return new Promise(resolve => {
      const rec = new SR();
      rec.lang = document.documentElement.lang || 'en-US';
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;

      let final = '';
      let settled = false;
      aborting = false;
      const done = out => {
        if (settled) return;
        settled = true;
        clearTimeout(cap);
        listening = false;
        recogniser = null;
        resolve(out);
      };

      let announced = false;
      const speechStarted = () => {
        if (announced) return;
        announced = true;
        onSpeech?.();
      };
      rec.onspeechstart = speechStarted;
      rec.onsoundstart = speechStarted;

      rec.onresult = e => {
        speechStarted();          // some builds skip onspeechstart
        let interim = '';
        for (const r of e.results) {
          if (r.isFinal) final += r[0].transcript;
          else interim += r[0].transcript;
        }
        onInterim((final + interim).trim());
      };

      rec.onerror = e => done({ error: e.error || 'error', intentional: aborting });
      rec.onend = () => {
        const t = final.trim();
        done(t ? { transcript: t } : { error: 'no-speech' });
      };

      // Don't hold the mic open forever if the browser forgets to stop.
      const cap = setTimeout(() => { try { rec.stop(); } catch { /* ignore */ } }, 15000);

      recogniser = rec;
      listening = true;
      try { rec.start(); }
      catch (err) { done({ error: 'start-failed' }); }
    });
  }

  function stopListening() {
    if (!recogniser) return;
    aborting = true;
    try { recogniser.abort(); } catch { /* ignore */ }
    recogniser = null;
    listening = false;
  }

  return { support, unlock, speak, shutUp, listen, stopListening,
           get listening() { return listening; } };
})();

<script>
/* ─────────────────────────────────────────────────────────────
   dialogue.js — the script Officer Vance is working from.

   A node = one thing he asks. Each intent is a way you might
   answer it: chips are the shortcuts, `keys` catch free text.
   `suspicion` accumulates and decides how the interview ends.
   ───────────────────────────────────────────────────────────── */

const Dialogue = (() => {

  const NODES = {

    /* ── documents ─────────────────────────────────────────── */
    greet: {

      intents: [

          reply: 'Thank you.', next: 'purpose' },

        { id: 'missing', label: "I can't find it",
          say: "I can't find it.",
          keys: ["can't find", 'cant find', 'lost', 'forgot', "don't have", 'dont have', 'no passport'],

    purpose: {

          set: { purpose: 'tourism' }, reply: 'Sightseeing. Alright.', next: 'duration' },

        { id: 'business', label: 'Business',
          say: 'Business.',
          keys: ['business', 'work', 'conference', 'meeting', 'client', 'job'],
          set: { purpose: 'business' }, reply: 'Business.', next: 'business_probe' },

        { id: 'family', label: 'Visiting family',
          say: "I'm visiting family.",
          keys: ['family', 'friend', 'visiting', 'wedding', 'mother', 'father', 'brother', 'sister', 'partner'],
          set: { purpose: 'family' }, reply: 'Family. Nice this time of year.', next: 'duration' },

        { id: 'study', label: 'Studying',
          say: "I'm here to study.",
          keys: ['study', 'student', 'school', 'university', 'exchange', 'course'],

          keys: ['personal', 'private', 'secret', 'not sure', 'dunno', "don't know", 'none of your'],

    },

    business_probe: {

        { id: 'named', label: 'A client, I have the address',

        { id: 'evasive', label: "I'd rather not say",

    /* ── stay ──────────────────────────────────────────────── */
    duration: {
      mood: 'neutral',
      ask: ['How long are you staying?'],
      intents: [
        { id: 'short', label: 'About a week',
          say: 'About a week.',
          keys: ['week', 'day', 'days', 'weekend', 'short', 'brief', 'few'],
          set: { duration: 'about a week' }, reply: 'A week. Fine.', next: 'stay' },

        { id: 'long', label: 'A few months',
          say: 'A few months.',
          keys: ['month', 'months', 'year', 'long', 'while', 'season'],
          set: { duration: 'a few months' },
          reply: "That's a long holiday. Return ticket?", suspicion: 2, next: 'stay' },

        { id: 'open', label: "I haven't decided",
          say: "I haven't decided.",
          keys: ["haven't decided", 'havent decided', 'not sure', 'open', 'one way', 'one-way', 'depends', 'indefinite'],
          set: { duration: 'undecided' },
          reply: 'One-way and undecided. I do love a mystery.', suspicion: 3, next: 'stay' }
      ],
      fallback: { reply: 'A number, please.', suspicion: 1, next: 'stay' }
    },

    stay: {
      mood: 'neutral',
      ask: ['And where will you be staying?'],
      intents: [
        { id: 'hotel', label: 'A hotel downtown',
          say: 'A hotel downtown.',
          keys: ['hotel', 'hostel', 'airbnb', 'apartment', 'rental', 'booked', 'reservation'],
          set: { stay: 'a hotel' }, reply: 'Booked in advance. Refreshing.', next: 'luggage' },

        { id: 'friends', label: 'With friends',

          set: { stay: 'with friends' }, reply: 'With friends. Address on the form, then.', next: 'luggage' },

        { id: 'nowhere', label: "I'll figure it out",
          say: "I'll figure it out.",
          keys: ['figure it out', 'no idea', "don't know", 'dont know', 'nowhere', 'wherever', 'car', 'not sure'],
          set: { stay: 'undecided' },

    luggage: {
      mood: 'stern',

      intents: [
        { id: 'self', label: 'Yes, myself',

        { id: 'other', label: 'Someone helped me',
          say: 'Someone helped me.',
          keys: ['helped', 'someone', 'my partner', 'my mother', 'wife', 'husband', 'roommate', 'no'],

          say: "I'm carrying something for a friend.",
          keys: ['carrying', 'favour', 'favor', 'package', 'parcel', 'for a friend', 'deliver'],
          reply: 'A parcel. For a friend. You cannot possibly be serious.',
          suspicion: 5, mood: 'suspicious', next: 'declare' }
      ],
      fallback: { reply: "I'll take that as a yes.", next: 'declare' }
    },

    /* ── declaration ───────────────────────────────────────── */
    declare: {
      mood: 'stern',
      ask: ['Anything to declare? Food, plants, animal products,',
            'currency above ten thousand.'],
      intents: [
        { id: 'nothing', label: 'Nothing to declare',
          say: 'Nothing to declare.',
          keys: ['nothing', 'no', 'none', 'nope', 'clean', 'empty'],
          set: { declare: 'nothing' }, reply: 'Nothing at all.', next: 'verdict' },

        { id: 'food', label: 'Some food from home',
          say: 'Some food from home.',
          keys: ['food', 'cheese', 'meat', 'sausage', 'fruit', 'honey', 'chocolate', 'snack', 'sandwich', 'plant', 'seeds'],
          set: { declare: 'food' }, reply: 'Food. Show me.', suspicion: 1, next: 'probe_food' },

        { id: 'cash', label: 'Cash, a fair amount',
          say: 'Some cash.',
          keys: ['cash', 'money', 'currency', 'euro', 'dollar', 'notes', 'gold'],
          set: { declare: 'currency' }, reply: 'Currency. How much, exactly?', suspicion: 1, next: 'probe_cash' },

        { id: 'gift', label: 'Just souvenirs',
          say: 'Just souvenirs.',
          keys: ['gift', 'souvenir', 'present', 'shopping', 'perfume', 'watch'],
          set: { declare: 'souvenirs' }, reply: 'Souvenirs. Keep the receipts.', next: 'verdict' },

        { id: 'contraband', label: 'A live parrot',
          say: 'A live parrot.',
          keys: ['parrot', 'drugs', 'gun', 'weapon', 'knife', 'bomb', 'snake', 'lizard', 'animal', 'ivory'],
          set: { declare: 'something alarming' },
          reply: 'Say that again slowly, and think about it first.',
          suspicion: 7, mood: 'suspicious', next: 'verdict' }
      ],
      fallback: { reply: "That's a yes or a no.", suspicion: 1, keep: true },
      escape: 'verdict'
    },

    probe_food: {
      mood: 'neutral',
      ask: ['Is it sealed, commercially packaged?'],
      intents: [
        { id: 'sealed', label: 'Sealed, from a shop',
          say: 'Sealed, from a shop.',
          keys: ['sealed', 'shop', 'packaged', 'store', 'yes', 'factory', 'wrapped'],
          reply: 'Then it stays with you.', next: 'verdict' },
        { id: 'homemade', label: "It's homemade",
          say: "It's homemade.",
          keys: ['homemade', 'home', 'grandma', 'mother', 'no', 'open', 'fresh', 'raw'],
          reply: 'Homemade. That goes in the bin on your left.', suspicion: 2, next: 'verdict' }
      ],
      fallback: { reply: 'We will look at it either way.', suspicion: 1, next: 'verdict' }
    },

    probe_cash: {
      mood: 'stern',
      ask: ['A number, please.'],
      intents: [
        { id: 'under', label: 'Under ten thousand',
          say: 'Under ten thousand.',
          keys: ['under', 'less', 'below', 'small', 'nothing much', 'a few hundred'],
          reply: 'Under the limit. Nothing to file.', next: 'verdict' },
        { id: 'over', label: 'More than ten thousand',
          say: 'More than ten thousand.',
          keys: ['over', 'more', 'above', 'a lot', 'million', 'plenty', 'fifty', 'twenty'],
          reply: 'Then you fill out a form. A long one.', suspicion: 3, next: 'verdict' },
        { id: 'coy', label: "I'd rather not say",
          say: "I'd rather not say.",
          keys: ['rather not', "won't say", 'wont say', 'private', 'none of', 'secret'],
          reply: 'Declining to count it is itself an answer.', suspicion: 4, next: 'verdict' }
      ],
      fallback: { reply: 'I will assume it is more than you should carry.', suspicion: 2, next: 'verdict' }
    },

    /* ── verdict ───────────────────────────────────────────── */
    verdict: { final: true }
  };

  /* ── free-text matching ──────────────────────────────────── */

  function hits(text, key) {
    if (key.length <= 3) {
      return new RegExp(`\\b${key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`).test(text) ? key.length : 0;
    }
    return text.includes(key) ? key.length : 0;
  }

  // Best intent wins by total weight of matched keywords; ties go to
  // the intent declared first, which is why the safe answers lead.
  function match(node, text) {
    const t = ' ' + text.toLowerCase().trim() + ' ';
    let best = null, bestScore = 0;

    for (const intent of node.intents || []) {
      let score = 0;
      for (const key of intent.keys || []) score += hits(t, key);
      if (score > bestScore) { best = intent; bestScore = score; }
    }
    return best || Object.assign({ id: '_fallback', fallback: true }, node.fallback);
  }

  /* ── the ending ──────────────────────────────────────────── */

  function recap(facts) {
    const bits = [];
    if (facts.purpose)  bits.push(facts.purpose === 'unstated' ? 'purpose unstated' : facts.purpose);
    if (facts.duration) bits.push(facts.duration);
    if (facts.stay)     bits.push(facts.stay);
    if (facts.declare)  bits.push('declaring ' + facts.declare);
    return bits.join(', ');
  }

  function verdict(state) {
    const s = state.suspicion;
    const line = recap(state.facts);

    if (s <= 2) {
      return {
        approved: true, mood: 'friendly', label: 'ENTRY GRANTED',
        lines: [
          line ? `So: ${line}.` : 'So: nothing out of the ordinary.',
          'Everything checks out.',
          'Welcome. Enjoy your stay — and keep the passport dry.'
        ]
      };
    }
    if (s <= 6) {
      return {
        approved: true, mood: 'stern', label: 'ENTRY GRANTED — FLAGGED',
        lines: [
          line ? `So: ${line}.` : 'So: a great deal left unsaid.',
          'A few of your answers I did not care for.',
          "I'm letting you through. Your bags go through the scanner first.",
          'Welcome to the country. Behave.'
        ]
      };
    }
    return {
      approved: false, mood: 'suspicious', label: 'REFERRED TO SECONDARY',
      lines: [
        line ? `So: ${line}.` : 'So: nothing I can write down.',
        'No. I have heard enough.',
        'Take your documents and follow the red line to the room with no windows.',
        'Someone will be with you. Eventually.'
      ]
    };
  }

  return { NODES, match, verdict, start: 'greet' };
})();

<script>
/* ─────────────────────────────────────────────────────────────
   app.js — wires the script to the puppet, the voice and the panel.

   The interview is spoken, both ways. There is no text box: he asks,
   the microphone opens, you answer out loud. Stay quiet long enough
   and a cue appears with a line to say — a prompt, not a button.

   The one exception is a browser that cannot listen at all. Then the
   cues turn into something you can click, because the alternative is
   a conversation nobody can finish.
   ───────────────────────────────────────────────────────────── */

(() => {

  const log      = document.getElementById('log');
  const chips    = document.getElementById('chips');
  const cue      = document.getElementById('cue');
  const cueLabel = document.getElementById('cue-label');
  const cueLine  = document.getElementById('cue-line');
  const mic      = document.getElementById('mic');
  const listenState = document.getElementById('listen-state');
  const composer = document.querySelector('.composer');
  const hudDot   = document.getElementById('hud-dot');
  const hudText  = document.getElementById('hud-text');
  const gate     = document.getElementById('gate');
  const gateNote = document.getElementById('gate-note');

  const HINT_WAIT  = 3400;   // silence he will tolerate before prompting
  const HINT_CYCLE = 5600;   // then he offers a different answer
  const GIVE_UP    = 4;      // silent rounds before the mic parks itself

  const state = { suspicion: 0, facts: {}, node: null, strikes: 0, over: false };
  const voice = { out: false, in: false };

  let interimEl = null;
  let misses = 0;
  let hintTimer = null, hintCycle = null, hintIndex = 0;

  /* ── panel plumbing ──────────────────────────────────────── */

  function scroll() { log.scrollTop = log.scrollHeight; }

  function bubble(kind, text = '') {
    const el = document.createElement('div');
    el.className = 'msg ' + kind;
    el.textContent = text;
    log.appendChild(el);
    scroll();
    return el;
  }

  function note(text, tone = '') { bubble('note ' + tone, text); }

  function hud(label, tone = '') {
    hudDot.className = 'hud-dot' + (tone ? ' ' + tone : '');
    hudText.textContent = 'BOOTH 4 · LANE B · ' + label;
  }

  function setBusy(on) {
    composer.classList.toggle('locked', on);
    if (on) { hud('SPEAKING', 'busy'); say_state('He is speaking'); }
    else if (!state.over) hud('OPEN');
  }

  function say_state(text) { listenState.textContent = text; }

  function setListening(on) {
    mic.classList.toggle('listening', on);
    mic.setAttribute('aria-pressed', String(on));
    if (on) { hud('LISTENING', 'live'); say_state('Listening — answer out loud'); }
    else if (!state.over && !composer.classList.contains('locked')) hud('OPEN');
  }

  // One line, spoken aloud if he has a voice, typed out as a caption if not.
  async function say(line) {
    const el = bubble('officer');
    el.classList.add('caret');
    const render = s => { el.textContent = s; scroll(); };

    let spoken = false;
    if (voice.out) {
      spoken = await Voice.speak(line, render);
      if (!spoken) {
        voice.out = false;
        note('NO VOICE ON THIS BROWSER — CAPTIONS ONLY');
      }
    }
    if (!spoken) await Officer.speak(line, render);

    el.classList.remove('caret');
    await Officer.pause(spoken ? 120 : 260);
  }

  function showInterim(text) {
    if (!interimEl) interimEl = bubble('you interim');
    interimEl.textContent = text;
    scroll();
  }

  function clearInterim() {
    interimEl?.remove();
    interimEl = null;
  }

  /* ── the cue ─────────────────────────────────────────────── */

  // What this question could be answered with, phrased to be said.
  function suggestions() {
    return (state.node?.intents || [])
      .filter(i => i.label)
      .map(i => i.say || i.label);
  }

  function showCue(i) {
    const lines = suggestions();
    if (!lines.length) return;
    hintIndex = i % lines.length;
    cueLine.textContent = '“' + lines[hintIndex] + '”';
    cue.hidden = false;
    cue.classList.remove('pop');
    void cue.offsetWidth;
    cue.classList.add('pop');
  }

  function hideCue() {
    cue.hidden = true;
    cue.classList.remove('pop');
  }

  // The clock belongs to the question, not to one recognition attempt:
  // the mic reopens every few seconds while you are silent, and
  // re-arming each time would reset the wait and freeze the cue on its
  // first suggestion forever.
  function armHint() {
    if (hintTimer || hintCycle) return;
    if (!suggestions().length) return;
    hintTimer = setTimeout(() => {
      showCue(hintIndex);
      hintCycle = setInterval(() => showCue(hintIndex + 1), HINT_CYCLE);
    }, HINT_WAIT);
  }

  function disarmHint() {
    clearTimeout(hintTimer);
    clearInterval(hintCycle);
    hintTimer = hintCycle = null;
  }

  /* ── the interview ───────────────────────────────────────── */

  async function enter(id, extraLines = []) {
    const node = Dialogue.NODES[id];
    state.node = node;
    state.strikes = 0;
    misses = 0;
    hintIndex = 0;

    if (node.final) return finish();

    setBusy(true);
    if (node.mood) Officer.setMood(node.mood);

    for (const line of extraLines) await say(line);
    const asks = typeof node.ask === 'function' ? node.ask(state) : node.ask;
    for (const line of asks) await say(line);

    setBusy(false);
    openMic();
  }

  // Re-ask without repeating the whole preamble.
  async function reask(extraLines) {
    misses = 0;              // a fresh question deserves fresh patience
    setBusy(true);
    for (const line of extraLines) await say(line);
    setBusy(false);
    openMic();
  }

  async function answer(shown, intent) {
    if (!state.node || state.over || composer.classList.contains('locked')) return;

    Voice.stopListening();
    disarmHint();
    hintIndex = 0;
    hideCue();
    chips.replaceChildren();
    setListening(false);
    clearInterim();
    bubble('you', shown);
    setBusy(true);

    const node = state.node;
    const picked = intent || Dialogue.match(node, shown);

    state.suspicion += picked.suspicion || 0;
    Object.assign(state.facts, picked.set || {});
    if (picked.mood) Officer.setMood(picked.mood);

    await Officer.pause(300);

    const lines = picked.reply ? [picked.reply] : [];

    // Nobody gets to stonewall the same question forever.
    if (picked.keep) {
      state.strikes++;
      if (state.strikes >= 2 && node.escape) {
        state.suspicion += 1;
        return enter(node.escape, lines.concat(["We'll come back to that."]));
      }
      return reask(lines);
    }

    return enter(picked.next || 'verdict', lines);
  }

  /* ── the microphone ──────────────────────────────────────── */

  async function openMic() {
    if (state.over) return;
    if (!voice.in) return offerClickableCues();
    if (Voice.listening) return;

    setListening(true);
    armHint();

    const heard = await Voice.listen(showInterim, () => {
      disarmHint();          // they started talking; stop nagging
      hideCue();
    });

    setListening(false);

    if (state.over || !voice.in) return clearInterim();

    if (heard.transcript) {
      clearInterim();
      hideCue();
      return answer(heard.transcript, null);
    }

    switch (heard.error) {
      case 'aborted':
        if (heard.intentional) return clearInterim();
        return dropVoiceInput('THE MICROPHONE WAS CUT OFF');

      case 'not-allowed':
      case 'service-not-allowed':
      case 'unsupported':
      case 'start-failed':
        return dropVoiceInput('MICROPHONE UNAVAILABLE');

      case 'network':
        return dropVoiceInput('SPEECH SERVICE UNREACHABLE');

      default:                                  // no-speech, mostly
        clearInterim();
        armHint();                              // if a false start killed it
        if (++misses === 1 || misses === 3) {
          setBusy(true);
          await say(misses === 1 ? "I didn't catch that." : 'Any time you like.');
          setBusy(false);
        }
        if (misses >= GIVE_UP) {                // stop reopening on a dead room
          disarmHint();
          showCue(hintIndex);
          say_state('Tap the microphone when you are ready');
          return;
        }
        if (!cue.hidden) showCue(hintIndex + 1);
        return openMic();
    }
  }

  // Only reached when this browser cannot listen at all. The cues stop
  // being prompts and become the way through.
  function offerClickableCues() {
    hideCue();
    chips.replaceChildren();
    const lines = state.node?.intents?.filter(i => i.label) || [];
    for (const intent of lines) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = intent.say || intent.label;
      b.addEventListener('click', () => answer(intent.say || intent.label, intent));
      chips.appendChild(b);
    }
    say_state('No microphone — pick an answer');
  }

  function dropVoiceInput(message) {
    voice.in = false;
    clearInterim();
    disarmHint();
    setListening(false);
    mic.classList.add('dead');
    note(message + ' — PICK AN ANSWER INSTEAD');
    offerClickableCues();
  }

  mic.addEventListener('click', () => {
    if (Voice.listening) {
      Voice.stopListening();
      disarmHint();
      setListening(false);
      clearInterim();
      say_state('Tap the microphone when you are ready');
    } else if (!composer.classList.contains('locked') && !state.over) {
      misses = 0;
      openMic();
    }
  });

  /* ── ending ──────────────────────────────────────────────── */

  async function finish() {
    state.over = true;
    setBusy(true);
    disarmHint();
    hideCue();
    chips.replaceChildren();
    Voice.stopListening();
    setListening(false);

    const result = Dialogue.verdict(state);
    Officer.setMood(result.mood);

    for (const line of result.lines) await say(line);

    Officer.lookAt('passport');
    await Officer.pause(320);
    await Officer.stamp(result.approved);

    note(result.label, result.approved ? 'pass' : 'fail');
    note(`flags raised · ${state.suspicion}`);
    hud(result.approved ? 'CLEARED' : 'HOLD', result.approved ? '' : 'closed');

    const again = document.createElement('button');
    again.type = 'button';
    again.className = 'chip primary';
    again.textContent = 'Next traveller';
    again.addEventListener('click', restart);
    chips.appendChild(again);

    composer.classList.remove('locked');
    mic.disabled = true;
    say_state('The counter is closed');
  }

  function restart() {
    Voice.shutUp();
    Voice.stopListening();
    state.suspicion = 0;
    state.facts = {};
    state.over = false;
    misses = 0;
    log.replaceChildren();
    chips.replaceChildren();
    clearInterim();
    hideCue();
    mic.disabled = false;
    Officer.reset();
    enter(Dialogue.start);
  }

  /* ── the gate ────────────────────────────────────────────── */

  async function begin() {
    const start = document.getElementById('gate-start');
    start.disabled = true;
    start.textContent = 'One moment…';

    const got = await Voice.unlock();
    voice.out = got.speak;
    voice.in  = got.listen;
    mic.classList.toggle('dead', !got.listen);

    if (!got.listen && got.reason) {
      gateNote.textContent = got.reason + ' You can still pick your answers.';
      await new Promise(r => setTimeout(r, 2200));
    }

    gate.classList.add('open');
    setTimeout(() => { gate.hidden = true; }, 400);
    enter(Dialogue.start);
  }

  document.getElementById('gate-start').addEventListener('click', begin);

  if (!Voice.support.listen) {
    gateNote.textContent = 'This browser has no speech recognition — Chrome, Edge or Safari do.';
  } else if (location.protocol === 'file:') {
    gateNote.textContent = 'Opened from a file — the microphone needs the page served over http://localhost.';
  }

  composer.classList.add('locked');
  Officer.init();
})();
</script>
</body>
</html>
