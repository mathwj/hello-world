<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Border Control — Booth 4</title>
<meta name="description" content="An interactive customs officer you can talk to." />
<style>
/* ─────────────────────────────────────────────────────────────
   Border Control — minimal customs booth
   ───────────────────────────────────────────────────────────── */

:root {
  --bg:            #0e1418;
  --panel:         #131b21;
  --panel-2:       #18232a;
  --line:          #24333c;
  --ink:           #dfe8ec;
  --ink-dim:       #7f929c;
  --accent:        #e0a94a;
  --accent-soft:   #f0cf95;
  --green:         #58b28a;
  --red:           #cf6a5a;

  --wall:          #23343a;
  --wall-top:      #2a3d44;
  --counter:       #16222a;
  --counter-top:   #35505b;
  --uniform:       #2c4a63;
  --uniform-dark:  #22394c;
  --shirt:         #cdd8de;
  --skin:          #d9a582;
  --skin-dark:     #c4906e;

  --radius: 12px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

/* Author `display` rules outrank the UA's [hidden] rule, and .mic and
   .gate both set one — without this, hiding them does nothing. */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
}

/* ── stage ─────────────────────────────────────────────────── */

.stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--wall);
  overflow: hidden;
}

#booth {
  width: 100%;
  height: 100%;
  display: block;
}

.stage-hud {
  position: absolute;
  left: 18px;
  bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--ink-dim);
  background: rgba(8, 12, 15, 0.55);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 12px;
  backdrop-filter: blur(4px);
}

.hud-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 3.2s ease-in-out infinite;
}
.hud-dot.busy   { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.hud-dot.closed { background: var(--red);    box-shadow: 0 0 8px var(--red); }
.hud-dot.live   { background: #6fc3e8; box-shadow: 0 0 8px #6fc3e8;
                  animation-duration: 1.1s; }

/* ── booth artwork ─────────────────────────────────────────── */

.wall        { fill: var(--wall); }
.wall-panel  { fill: var(--wall-top); }
.wall-seam   { stroke: rgba(0,0,0,.22); stroke-width: 2; }

.lamp-body   { fill: #3d545c; }
.lamp-glow   { fill: url(#glow); animation: lampBreath 9s ease-in-out infinite; }
.vignette    { fill: url(#vignette); }

.sign-plate  { fill: #17252b; stroke: #3a545e; stroke-width: 1.4; }
.sign-text   { fill: var(--accent-soft); font-family: var(--mono); font-size: 11px;
               letter-spacing: .06em; text-anchor: middle; }
.sign-lamp   { fill: var(--accent); opacity: .85; animation: blinkLamp 2.6s steps(1) infinite; }
.sign-lamp--alt { animation-delay: 1.3s; }

.uniform      { fill: var(--uniform); }
.uniform-dark { fill: var(--uniform-dark); }
.shirt        { fill: var(--shirt); }
.epaulette    { fill: #3d6484; }
.nameplate    { fill: #9fb0bb; }
.chest-badge  { fill: var(--accent); opacity: .9; }

.skin        { fill: var(--skin); }
.skin-dark   { fill: var(--skin-dark); }
.skin-shade  { fill: rgba(0,0,0,.07); }

.eye-white   { fill: #f3f6f7; }
.pupil       { fill: #223038; }
.glint       { fill: #fff; opacity: .85; }
.brow        { fill: #3a2a22; }
.nose        { fill: none; stroke: var(--skin-dark); stroke-width: 2; stroke-linecap: round; }
#mouth       { fill: #6d3a37; }

.cap-crown   { fill: #24405a; }
.cap-band    { fill: #1b3044; }
.cap-brim    { fill: #16273a; }
.cap-badge   { fill: var(--accent); }

.counter-top  { fill: var(--counter-top); }
.counter-face { fill: var(--counter); }
.counter-seam { stroke: rgba(255,255,255,.05); stroke-width: 2; }

#status-light { fill: var(--green); opacity: .9; animation: pulse 3.2s ease-in-out infinite; }
#status-light.busy   { fill: var(--accent); }
#status-light.closed { fill: var(--red); }

.passport-cover { fill: #3d2a34; }
.passport-mark  { fill: var(--accent); opacity: .55; }

/* #passport carries an SVG rotate() attribute — do NOT give it a
   transform-origin here, the browser would apply the origin on top
   of the rotation's own centre and shove it off the counter. */

.stamp-body { fill: #22323c; }
.stamp-head { fill: #6b8492; }

#stamp-mark {
  opacity: 0;
  transform-box: view-box;
  transform-origin: 304px 213px;
}
#stamp-mark rect {
  fill: none; stroke: var(--green); stroke-width: 2;
}
#stamp-mark text {
  fill: var(--green); font-family: var(--mono); font-size: 6.6px;
  letter-spacing: .06em; text-anchor: middle;
}
#stamp-mark.denied rect { stroke: var(--red); }
#stamp-mark.denied text { fill: var(--red); }
#stamp-mark.on { animation: stampIn .45s cubic-bezier(.2,1.5,.4,1) forwards; }

/* ── rigging / motion ──────────────────────────────────────── */

#body {
  transform-box: view-box;
  transform-origin: 200px 224px;
  animation: breathe 4.4s ease-in-out infinite;
}

#head-rig {
  transform-box: view-box;
  transform-origin: 200px 132px;
  animation: sway 7.3s ease-in-out infinite;
}

#head-look {
  transform-box: view-box;
  transform-origin: 200px 132px;
  will-change: transform;
}

.pupil-rig { transform-box: view-box; will-change: transform; }

#eyes .eye {
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 80ms ease-out;
}
#officer.blink .eye { transform: scaleY(.08); }

/* moods — small offsets, read clearly at a glance */
#brows { transform-box: view-box; transform-origin: 200px 84px;
         transition: transform 260ms ease-out; }
#officer.mood-suspicious #brows { transform: translateY(3.4px) scaleX(1.04); }
#officer.mood-friendly   #brows { transform: translateY(-2.4px); }
#officer.mood-suspicious #eyes .eye { transform: scaleY(.72); }
#officer.blink.mood-suspicious #eyes .eye { transform: scaleY(.08); }

#stamp-arm {
  transform-box: view-box;
  transform-origin: 268px 172px;   /* the shoulder */
  transform: rotate(-34deg);
  opacity: 0;
}
#stamp-arm.stamping { animation: stampSwing 1.5s cubic-bezier(.4,0,.2,1) forwards; }

#counter { transform-box: view-box; }
#counter.jolt { animation: jolt .22s ease-out; }

@keyframes breathe {
  0%, 100% { transform: translateY(0)      scaleY(1);     }
  45%      { transform: translateY(-1.3px) scaleY(1.014); }
}

@keyframes sway {
  0%, 100% { transform: rotate(-1.1deg) translateX(-.6px); }
  50%      { transform: rotate(1.2deg)  translateX(.6px);  }
}

@keyframes lampBreath {
  0%, 100% { opacity: .82; }
  50%      { opacity: 1;   }
}

@keyframes blinkLamp {
  0%, 49%   { opacity: .85; }
  50%, 100% { opacity: .18; }
}

@keyframes pulse {
  0%, 100% { opacity: .35; }
  50%      { opacity: 1;   }
}

@keyframes stampIn {
  0%   { opacity: 0; transform: scale(2.1) rotate(-14deg); }
  60%  { opacity: 1; transform: scale(.94) rotate(-4deg);  }
  100% { opacity: 1; transform: scale(1)   rotate(-3deg);  }
}

@keyframes stampSwing {
  0%   { opacity: 0; transform: rotate(-34deg); }
  12%  { opacity: 1; transform: rotate(-26deg); }
  42%  { opacity: 1; transform: rotate(-36deg); }   /* wind up */
  56%  { opacity: 1; transform: rotate(3deg);   }   /* thud */
  66%  { opacity: 1; transform: rotate(-1deg);  }
  86%  { opacity: 1; transform: rotate(-22deg); }
  100% { opacity: 0; transform: rotate(-34deg); }
}

@keyframes jolt {
  0%, 100% { transform: translateY(0); }
  40%      { transform: translateY(1.6px); }
}

/* ── conversation panel ────────────────────────────────────── */

.panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border-left: 1px solid var(--line);
}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 20px 22px 16px;
  border-bottom: 1px solid var(--line);
}

.toggle {
  flex: none;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--ink-dim);
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 11px;
  cursor: pointer;
  transition: color 140ms, border-color 140ms;
}
.toggle[aria-pressed="true"] { color: var(--accent-soft); border-color: var(--accent); }
.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel-head h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.panel-head p {
  margin: 6px 0 0;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--ink-dim);
}

.log {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}

.msg {
  max-width: 88%;
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 14.5px;
  line-height: 1.5;
  animation: rise .32s ease-out both;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.msg.officer {
  align-self: flex-start;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
}

.msg.you {
  align-self: flex-end;
  background: #2c4a63;
  color: #eef4f7;
  border-bottom-right-radius: 4px;
}

.msg.note {
  align-self: center;
  max-width: 100%;
  background: none;
  border: none;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-dim);
  padding: 2px 0;
}
.msg.note.pass { color: var(--green); }
.msg.note.fail { color: var(--red); }

/* what the microphone thinks it is hearing, so far */
.msg.you.interim {
  background: none;
  border: 1px dashed #3d5764;
  color: var(--ink-dim);
  font-style: italic;
}

.caret::after {
  content: "▍";
  color: var(--accent);
  animation: caret .9s steps(1) infinite;
}

@keyframes caret { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }

@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

/* ── composer ──────────────────────────────────────────────── */

.composer {
  border-top: 1px solid var(--line);
  padding: 14px 22px 18px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.chips:empty { margin-bottom: 0; }

.chip {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
  transition: background 140ms, border-color 140ms, transform 140ms;
  animation: rise .26s ease-out both;
}
.chip:hover { background: #22323c; border-color: #3d5764; transform: translateY(-1px); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip.primary { border-color: var(--accent); color: var(--accent-soft); }

.input-row {
  display: flex;
  gap: 8px;
}

/* ── microphone ────────────────────────────────────────────── */

.mic {
  flex: none;
  width: 44px;
  height: 44px;
  padding: 0;
  display: grid;
  place-items: center;
  color: var(--ink-dim);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
  transition: color 160ms, border-color 160ms, background 160ms;
}
.mic svg {
  width: 20px; height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
}
.mic svg rect { fill: currentColor; stroke: none; }
.mic:hover { color: var(--ink); border-color: #3d5764; }
.mic:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mic[disabled] { opacity: .4; cursor: default; }

.mic.listening {
  color: #0e1418;
  background: #6fc3e8;
  border-color: #6fc3e8;
  animation: micPulse 1.5s ease-out infinite;
}

@keyframes micPulse {
  0%   { box-shadow: 0 0 0 0 rgba(111, 195, 232, .5); }
  70%  { box-shadow: 0 0 0 10px rgba(111, 195, 232, 0); }
  100% { box-shadow: 0 0 0 0 rgba(111, 195, 232, 0); }
}

#input {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 14px;
}
#input::placeholder { color: #5d707b; }
#input:focus { outline: none; border-color: #3d5764; }

#send {
  font: inherit;
  font-size: 16px;
  width: 44px;
  color: #0e1418;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: opacity 140ms;
}
#send:hover { opacity: .88; }

.composer.locked { opacity: .4; pointer-events: none; }

/* ── gate ──────────────────────────────────────────────────── */

.gate {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(8, 12, 15, .72);
  backdrop-filter: blur(7px);
  z-index: 10;
  transition: opacity 380ms ease, visibility 380ms;
}
.gate.open { opacity: 0; visibility: hidden; }

.gate-card {
  max-width: 420px;
  text-align: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 30px 30px 26px;
  animation: rise .4s ease-out both;
}

.gate-kicker {
  margin: 0 0 12px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .18em;
  color: var(--accent);
}
.gate-card h2 {
  margin: 0 0 10px;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
}
.gate-copy {
  margin: 0 0 22px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink-dim);
}

.gate-btn {
  font: inherit;
  font-size: 15px;
  width: 100%;
  color: #0e1418;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  cursor: pointer;
  transition: opacity 140ms, transform 140ms;
}
.gate-btn:hover { transform: translateY(-1px); }
.gate-btn[disabled] { opacity: .6; transform: none; cursor: default; }

.gate-link {
  font: inherit;
  font-size: 13px;
  margin-top: 12px;
  color: var(--ink-dim);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.gate-link:hover { color: var(--ink); }

.gate-note {
  margin: 16px 0 0;
  min-height: 1em;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.6;
  color: var(--accent-soft);
}

.gate-btn:focus-visible,
.gate-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ── responsive ────────────────────────────────────────────── */

@media (max-width: 880px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(200px, 38vh) minmax(0, 1fr);
  }
  .panel { border-left: none; border-top: 1px solid var(--line); }
  .panel-head { padding: 14px 18px 12px; }
  .log { padding: 16px 18px; }
  .composer { padding: 12px 18px 16px; }
  .stage-hud { left: 12px; bottom: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  #body, #head-rig, .lamp-glow, .sign-lamp, .hud-dot, #status-light,
  #stamp-arm.stamping, #stamp-mark.on, #counter.jolt {
    animation: none;
  }
  .msg, .chip, .gate-card, .mic.listening { animation: none; }
  .mic.listening { box-shadow: 0 0 0 3px rgba(111, 195, 232, .4); }
  .log { scroll-behavior: auto; }
  #stamp-mark.on { opacity: 1; }
}
</style>
</head>
<body>

<main class="app">

  <!-- ───────────────────────── stage ───────────────────────── -->
  <section class="stage" id="stage" aria-label="Customs booth">
    <svg id="booth" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img"
         aria-label="A customs officer standing behind a counter">
      <title>Customs officer at booth 4</title>

      <defs>
        <radialGradient id="glow" cx="50%" cy="4%" r="72%">
          <stop offset="0%"   stop-color="#f4cd83" stop-opacity=".34" />
          <stop offset="50%"  stop-color="#f4cd83" stop-opacity=".10" />
          <stop offset="100%" stop-color="#f4cd83" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#000" stop-opacity="0" />
          <stop offset="100%" stop-color="#000" stop-opacity=".38" />
        </linearGradient>
      </defs>

      <!-- wall -->
      <rect class="wall" x="0" y="0" width="400" height="300" />
      <rect class="wall-panel" x="0" y="0" width="400" height="104" />
      <line class="wall-seam" x1="0" y1="104" x2="400" y2="104" />
      <rect class="vignette" x="0" y="120" width="400" height="112" />

      <!-- lamp -->
      <g id="lamp">
        <ellipse class="lamp-glow" cx="200" cy="10" rx="185" ry="120" />
        <rect class="lamp-body" x="150" y="0" width="100" height="9" rx="3" />
      </g>

      <!-- sign -->
      <g id="sign">
        <rect class="sign-plate" x="118" y="20" width="164" height="26" rx="4" />
        <text class="sign-text" x="200" y="37">C U S T O M S</text>
        <rect class="sign-lamp" x="126" y="28" width="6" height="10" rx="2" />
        <rect class="sign-lamp sign-lamp--alt" x="268" y="28" width="6" height="10" rx="2" />
      </g>

      <!-- ── officer ── -->
      <g id="officer">
        <g id="body">

          <!-- torso -->
          <path class="uniform" d="M126 252 C126 182 156 158 200 158 C244 158 274 182 274 252 Z" />
          <path class="uniform-dark" d="M186 152 L200 176 L214 152 Z" />
          <path class="shirt" d="M182 150 L200 172 L218 150 L214 146 L186 146 Z" />
          <rect class="epaulette" x="138" y="176" width="20" height="6" rx="3" />
          <rect class="epaulette" x="242" y="176" width="20" height="6" rx="3" />
          <rect class="nameplate" x="216" y="192" width="28" height="6" rx="2" />
          <g class="chest-badge">
            <path d="M160 190 l10 -4 l10 4 v8 c0 6 -5 9 -10 11 c-5 -2 -10 -5 -10 -11 z" />
          </g>

          <!-- neck -->
          <rect class="skin-dark" x="189" y="118" width="22" height="30" rx="8" />

          <g id="head-rig">
            <g id="head-look">

              <!-- ears -->
              <ellipse class="skin" cx="169" cy="98" rx="4.6" ry="6.6" />
              <ellipse class="skin" cx="231" cy="98" rx="4.6" ry="6.6" />

              <!-- head -->
              <ellipse class="skin" cx="200" cy="96" rx="30" ry="34" />
              <path class="skin-shade" d="M200 62 a30 34 0 0 1 0 68 z" />

              <!-- brows -->
              <g id="brows">
                <rect class="brow" x="180" y="81" width="15" height="3.4" rx="1.7" />
                <rect class="brow" x="205" y="81" width="15" height="3.4" rx="1.7" />
              </g>

              <!-- eyes -->
              <g id="eyes">
                <g class="eye">
                  <ellipse class="eye-white" cx="187.5" cy="94" rx="6.1" ry="4.4" />
                  <g class="pupil-rig">
                    <circle class="pupil" cx="187.5" cy="94" r="2.7" />
                    <circle class="glint" cx="188.7" cy="92.6" r="0.9" />
                  </g>
                </g>
                <g class="eye">
                  <ellipse class="eye-white" cx="212.5" cy="94" rx="6.1" ry="4.4" />
                  <g class="pupil-rig">
                    <circle class="pupil" cx="212.5" cy="94" r="2.7" />
                    <circle class="glint" cx="213.7" cy="92.6" r="0.9" />
                  </g>
                </g>
              </g>

              <!-- nose -->
              <path class="nose" d="M200 98 q-4 8 3 9" />

              <!-- mouth -->
              <path id="mouth" d="M191 118 Q200 117 209 118 Q200 120 191 118 Z" />

              <!-- cap -->
              <g id="cap">
                <path class="cap-crown" d="M172 63 q2 -23 28 -23 q26 0 28 23 z" />

<script>
/* ─────────────────────────────────────────────────────────────
   officer.js — the puppet.
   Owns everything that moves: breathing is CSS, but blinking,
   gaze, mouth shapes and the stamp are driven from here.
   ───────────────────────────────────────────────────────────── */

const Officer = (() => {

  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // mouth anchor, in viewBox units
  const MX = 200, MY = 118;

  const MOODS = {
    neutral:    { curve:  0.15, rest: 0.00 },
    friendly:   { curve:  0.60, rest: 0.02 },
    suspicious: { curve: -0.40, rest: 0.00 },
    stern:      { curve: -0.15, rest: 0.00 }
  };

  const el = {};
  const state = {
    mood: 'neutral',
    open: 0, openTarget: 0,     // jaw
    wide: 0, wideTarget: 0,     // lip spread
    gx: 0, gy: 0,               // current gaze, -1..1
    tgx: 0, tgy: 0,             // gaze target
    speaking: false,
    pointerAt: 0,
    nextIdleGaze: 0,
    nextBlink: 0
  };

  /* ── mouth geometry ──────────────────────────────────────── */

  // A lens shape: two quadratics between the mouth corners.
  // `open` drives the gap, `wide` stretches it, `curve` lifts the corners.
  function mouthPath(open, wide, curve) {
    const w = 10.6 + wide * 3.6;
    const h = Math.max(open * 9.5, 0.7);
    const c = curve * 3.6;
    const lx = MX - w, rx = MX + w, cy = MY - c;
    const upper = MY - h * 0.55;
    const lower = MY + h * 0.55 + 1.7;
    return `M ${lx} ${cy} Q ${MX} ${upper} ${rx} ${cy} Q ${MX} ${lower} ${lx} ${cy} Z`;
  }

  // Rough visemes. Not phonetics — just enough variation that the
  // face reads as talking instead of flapping.
  function visemeFor(ch) {
    const c = ch.toLowerCase();
    if ('aáà'.includes(c))            return { open: 0.95, wide: 0.55 };
    if ('oôu'.includes(c))            return { open: 0.80, wide: 0.00 };
    if ('eéi'.includes(c))            return { open: 0.55, wide: 0.90 };
    if ('yw'.includes(c))             return { open: 0.45, wide: 0.30 };
    if ('mbp'.includes(c))            return { open: 0.05, wide: 0.35 };
    if ('fv'.includes(c))             return { open: 0.18, wide: 0.55 };
    if ('szc'.includes(c))            return { open: 0.22, wide: 0.75 };
    if (' \n\t'.includes(c))          return { open: 0.06, wide: 0.15 };
    if ('.,!?;:—'.includes(c))        return { open: 0.02, wide: 0.10 };
    return { open: 0.42, wide: 0.45 };
  }

  /* ── frame loop ──────────────────────────────────────────── */

  function tick(now) {
    // gaze: follow the pointer when it is fresh, otherwise drift
    if (now - state.pointerAt > 2600 && now > state.nextIdleGaze) {
      state.tgx = (Math.random() * 2 - 1) * 0.55;
      state.tgy = (Math.random() * 2 - 1) * 0.35;
      state.nextIdleGaze = now + 1800 + Math.random() * 3200;
    }

    const ease = 0.07;
    state.gx += (state.tgx - state.gx) * ease;
    state.gy += (state.tgy - state.gy) * ease;

    el.headLook.style.transform =
      `translate(${state.gx * 2.2}px, ${state.gy * 1.4}px) rotate(${state.gx * 2.4}deg)`;
    el.pupils.forEach(p => {
      p.style.transform = `translate(${state.gx * 1.9}px, ${state.gy * 1.3}px)`;
    });

    // jaw: chase the current viseme, with a little tremor while voiced
    const snap = state.speaking ? 0.34 : 0.16;
    state.open += (state.openTarget - state.open) * snap;
    state.wide += (state.wideTarget - state.wide) * snap;

    const mood = MOODS[state.mood] || MOODS.neutral;
    const jitter = state.speaking ? (Math.random() - 0.5) * 0.06 : 0;
    el.mouth.setAttribute('d',
      mouthPath(Math.max(0, state.open + jitter + mood.rest), state.wide, mood.curve));

    // blink: mostly singles, sometimes a quick double
    if (now > state.nextBlink) {
      blink();
      state.nextBlink = now + (Math.random() < 0.18 ? 260 : 2200 + Math.random() * 4200);
    }

    requestAnimationFrame(tick);
  }

  function blink() {
    el.officer.classList.add('blink');
    setTimeout(() => el.officer.classList.remove('blink'), 95);
  }

  /* ── public API ──────────────────────────────────────────── */

  function init() {
    el.officer  = document.getElementById('officer');
    el.headLook = document.getElementById('head-look');
    el.mouth    = document.getElementById('mouth');
    el.pupils   = [...document.querySelectorAll('.pupil-rig')];
    el.arm      = document.getElementById('stamp-arm');
    el.stamp    = document.getElementById('stamp-mark');
    el.counter  = document.getElementById('counter');
    el.stage    = document.getElementById('stage');

    el.stage.addEventListener('pointermove', e => {
      const r = el.stage.getBoundingClientRect();
      state.tgx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width  - 0.5) * 2));
      state.tgy = Math.max(-1, Math.min(1, ((e.clientY - r.top)  / r.height - 0.42) * 2));
      state.pointerAt = performance.now();
    });

    setMood('neutral');
    requestAnimationFrame(tick);
  }

  function setMood(name) {
    state.mood = MOODS[name] ? name : 'neutral';
    el.officer.classList.remove('mood-neutral', 'mood-friendly', 'mood-suspicious', 'mood-stern');
    el.officer.classList.add('mood-' + state.mood);
  }

  function lookAt(where) {
    if (where === 'passport') { state.tgx = 0.7; state.tgy = 0.85; }
    else                      { state.tgx = 0;   state.tgy = 0;    }
    state.pointerAt = performance.now();   // hold it for a beat
  }

  /* ── mouth control, for whoever is doing the talking ─────── */

  function beginSpeech() { state.speaking = true; }

  function shape(ch) {
    const v = visemeFor(ch);
    state.openTarget = v.open;
    state.wideTarget = v.wide;
  }

  function endSpeech() {
    state.speaking = false;
    state.openTarget = 0;
    state.wideTarget = 0;
  }

  // Types `text` out, moving the mouth in step with it. Used when the
  // officer has no voice — with speech synthesis, voice.js drives the
  // same three functions from the utterance instead.
  // `onChar` receives the text so far so the caller can render a bubble.
  function speak(text, onChar) {
    return new Promise(resolve => {
      beginSpeech();
      let i = 0;

      const step = () => {
        if (i >= text.length) {
          endSpeech();
          return resolve();
        }

        const ch = text[i++];
        shape(ch);
        onChar(text.slice(0, i));

        let delay = REDUCED ? 4 : 26 + Math.random() * 18;
        if (',;:'.includes(ch)) delay += REDUCED ? 20 : 190;
        if ('.!?'.includes(ch)) delay += REDUCED ? 30 : 330;
        setTimeout(step, delay);
      };

      step();
    });
  }

  function pause(ms) {
    return new Promise(r => setTimeout(r, REDUCED ? Math.min(ms, 120) : ms));
  }

  // Reaches for the stamp, brings it down, leaves a mark.
  async function stamp(approved) {
    lookAt('passport');
    el.stamp.classList.toggle('denied', !approved);
    el.stamp.querySelector('text').textContent = approved ? 'CLEARED' : 'HOLD';

    el.arm.classList.remove('stamping');
    void el.arm.offsetWidth;               // restart the animation
    el.arm.classList.add('stamping');

    await pause(830);                      // impact
    el.counter.classList.add('jolt');
    el.stamp.classList.add('on');
    setTimeout(() => el.counter.classList.remove('jolt'), 240);

    await pause(900);
    lookAt('traveler');
  }

  function reset() {
    el.stamp.classList.remove('on', 'denied');
    el.arm.classList.remove('stamping');
    setMood('neutral');
    lookAt('traveler');
  }

  return { init, speak, beginSpeech, shape, endSpeech,
           pause, setMood, lookAt, stamp, reset, blink, REDUCED };
})();
</script>
<script>
/* ─────────────────────────────────────────────────────────────
   voice.js — the officer's voice, and your microphone.

   Output is speechSynthesis; the caption and the mouth are driven
   from the utterance itself (boundary events where the browser
   fires them, a learned chars-per-second estimate where it does
   not), so the lips match what you actually hear.

   Input is SpeechRecognition — Chrome, Edge and Safari only, and
   only on a secure origin. Everything degrades to typing.
   ───────────────────────────────────────────────────────────── */

const Voice = (() => {

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const TTS = 'speechSynthesis' in window;

  const support = { speak: TTS, listen: !!SR };

  let voice = null;         // chosen SpeechSynthesisVoice
  let recogniser = null;    // live SpeechRecognition, if any
  let listening = false;
  let aborting = false;     // did *we* stop it, or did the browser?

  /* ── picking a voice ─────────────────────────────────────── */

  // Nothing is guaranteed here: the voice list differs per OS and
  // loads asynchronously. Prefer something deep and English, then
  // settle for whatever English exists.
  const PREFERRED = [
    'google uk english male', 'daniel', 'microsoft guy', 'microsoft david',
    'alex', 'fred', 'google us english', 'microsoft mark'
  ];

  function pickVoice() {
    if (voice) return voice;
    const all = speechSynthesis.getVoices();
    if (!all.length) return null;

    for (const want of PREFERRED) {
      const hit = all.find(v => v.name.toLowerCase().includes(want));
      if (hit) return (voice = hit);
    }
    return (voice = all.find(v => /^en/i.test(v.lang)) || all[0]);
  }

  if (TTS) {
    speechSynthesis.getVoices();
    speechSynthesis.addEventListener?.('voiceschanged', () => { voice = null; pickVoice(); });
  }

  /* ── unlocking (needs a user gesture) ────────────────────── */

  // Browsers want a click before they will speak, and the mic needs
  // one permission prompt. Do both from the same gesture.
  async function unlock() {
    const out = { speak: false, listen: false, reason: '' };

    if (TTS) {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        speechSynthesis.speak(u);
        pickVoice();
        out.speak = true;
      } catch { /* stay silent, keep typing */ }
    }

    if (SR && navigator.mediaDevices?.getUserMedia) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());   // we only wanted the permission
        out.listen = true;
      } catch (err) {
        out.reason = err && err.name === 'NotAllowedError'
          ? (location.protocol === 'file:'
              ? 'The microphone is blocked on file:// — serve the page over http://localhost to talk.'
              : 'Microphone permission was declined.')
          : 'No microphone available.';
      }
    } else {
      out.reason = SR
        ? 'This browser will not hand over a microphone here.'
        : 'This browser has no speech recognition — Chrome, Edge or Safari do.';
    }

    return out;
  }

  /* ── speaking ────────────────────────────────────────────── */

  // Resolves true once the line has been spoken, false if the
  // browser refused — the caller then falls back to typing it out.
  function speak(text, onProgress) {
    if (!TTS) return Promise.resolve(false);

    return new Promise(resolve => {
      let settled = false;
      const finish = ok => {
        if (settled) return;
        settled = true;
        clearInterval(timer);
        clearTimeout(watchdog);
        Officer.endSpeech();
        if (ok) onProgress(text);
        resolve(ok);
      };

      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice();
      if (v) u.voice = v;
      u.rate = 0.97;
      u.pitch = 0.82;      // he is not a cheerful man

      let started = 0;
      let cursor = 0;      // characters revealed so far
      let anchor = 0;      // last position the browser confirmed
      let anchorAt = 0;
      let cps = 14.5;      // chars per second, corrected as we go
      let timer = null;

      const tick = () => {
        const est = anchor + ((performance.now() - anchorAt) / 1000) * cps;
        cursor = Math.min(text.length, Math.max(cursor, est));
        const shown = Math.floor(cursor);
        onProgress(text.slice(0, shown));
        Officer.shape(text[Math.min(shown, text.length - 1)] || ' ');
      };

      u.onstart = () => {
        started = anchorAt = performance.now();
        Officer.beginSpeech();
        timer = setInterval(tick, 55);
      };

      // Chrome reports word boundaries; use them to re-anchor the
      // caption and to learn this voice's real speaking rate.
      u.onboundary = e => {
        if (typeof e.charIndex !== 'number') return;
        const elapsed = (performance.now() - started) / 1000;
        if (elapsed > 0.4 && e.charIndex > 6) cps = e.charIndex / elapsed;
        anchor = Math.max(anchor, e.charIndex);
        anchorAt = performance.now();
      };

      u.onend = () => finish(true);
      u.onerror = () => finish(false);

      // If onstart never arrives the utterance was swallowed.
      const watchdog = setTimeout(() => { if (!started) finish(false); }, 1400);

      try {
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      } catch { finish(false); }
    });
  }

  function shutUp() {
    if (TTS) { try { speechSynthesis.cancel(); } catch { /* ignore */ } }
  }

  /* ── listening ───────────────────────────────────────────── */

  // Resolves { transcript } on speech, or { error } — 'no-speech',
  // 'not-allowed', 'aborted', 'network', 'unsupported'.
  function listen(onInterim) {
    if (!SR) return Promise.resolve({ error: 'unsupported' });

    return new Promise(resolve => {
      const rec = new SR();
      rec.lang = document.documentElement.lang || 'en-US';
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;

      let final = '';
      let settled = false;
      aborting = false;
      const done = out => {
        if (settled) return;
        settled = true;
        clearTimeout(cap);
        listening = false;
        recogniser = null;
        resolve(out);
      };

      rec.onresult = e => {
        let interim = '';
        for (const r of e.results) {
          if (r.isFinal) final += r[0].transcript;
          else interim += r[0].transcript;
        }
        onInterim((final + interim).trim());
      };

      rec.onerror = e => done({ error: e.error || 'error', intentional: aborting });
      rec.onend = () => {
        const t = final.trim();
        done(t ? { transcript: t } : { error: 'no-speech' });
      };

      // Don't hold the mic open forever if the browser forgets to stop.
      const cap = setTimeout(() => { try { rec.stop(); } catch { /* ignore */ } }, 15000);

      recogniser = rec;
      listening = true;
      try { rec.start(); }
      catch (err) { done({ error: 'start-failed' }); }
    });
  }

  function stopListening() {
    if (!recogniser) return;
    aborting = true;
    try { recogniser.abort(); } catch { /* ignore */ }
    recogniser = null;
    listening = false;
  }

  return { support, unlock, speak, shutUp, listen, stopListening,
           get listening() { return listening; } };
})();
</script>
<script>
/* ─────────────────────────────────────────────────────────────
   dialogue.js — the script Officer Vance is working from.

   A node = one thing he asks. Each intent is a way you might
   answer it: chips are the shortcuts, `keys` catch free text.
   `suspicion` accumulates and decides how the interview ends.
   ───────────────────────────────────────────────────────────── */

const Dialogue = (() => {

  const NODES = {

    /* ── documents ─────────────────────────────────────────── */
    greet: {
      mood: 'stern',
      ask: ['Next. Step up to the line.', 'Passport and travel documents, please.'],
      intents: [
        { id: 'hand', label: 'Hand over your passport',
          keys: ['here you go', 'here', 'passport', 'sure', 'of course', 'okay', 'ok', 'yes', 'take it'],
          reply: 'Thank you.', next: 'purpose' },

        { id: 'hello', label: 'Good morning',
          keys: ['hello', 'hi', 'hey', 'morning', 'evening', 'afternoon'],
          reply: 'Morning. Documents.', keep: true },

        { id: 'missing', label: "I can't find it",
          keys: ["can't find", 'cant find', 'lost', 'forgot', "don't have", 'dont have', 'no passport'],
          reply: 'Then this becomes a much longer morning. Check your pockets.',
          suspicion: 2, keep: true }
      ],
      fallback: { reply: 'Passport first. Then we talk.', keep: true },
      escape: 'purpose'
    },

    /* ── purpose ───────────────────────────────────────────── */
    purpose: {
      mood: 'neutral',
      ask: ['Purpose of your visit?'],
      intents: [
        { id: 'tourism', label: 'Tourism',
          keys: ['tourism', 'tourist', 'holiday', 'vacation', 'sightseeing', 'travel', 'fun', 'leisure'],
          set: { purpose: 'tourism' }, reply: 'Sightseeing. Alright.', next: 'duration' },

        { id: 'business', label: 'Business',
          keys: ['business', 'work', 'conference', 'meeting', 'client', 'job'],
          set: { purpose: 'business' }, reply: 'Business.', next: 'business_probe' },

        { id: 'family', label: 'Visiting family',
          keys: ['family', 'friend', 'visiting', 'wedding', 'mother', 'father', 'brother', 'sister', 'partner'],
          set: { purpose: 'family' }, reply: 'Family. Nice this time of year.', next: 'duration' },

        { id: 'study', label: 'Studying',
          keys: ['study', 'student', 'school', 'university', 'exchange', 'course'],
          set: { purpose: 'study' }, reply: 'Studying. Noted.', next: 'duration' },

        { id: 'vague',
          keys: ['personal', 'private', 'secret', 'not sure', 'dunno', "don't know", 'none of your'],
          set: { purpose: 'unstated' },
          reply: "'Personal.' That's not a category I have a box for. Try again.",
          suspicion: 3, keep: true }
      ],
      fallback: { reply: 'Shorter answer. Business, tourism, or family?', suspicion: 1, keep: true },
      escape: 'duration'
    },

    business_probe: {
      mood: 'neutral',
      ask: ['Who are you meeting with?'],
      intents: [
        { id: 'named', label: 'A client, I have the address',
          keys: ['client', 'company', 'office', 'address', 'colleague', 'supplier', 'partner', 'team'],
          reply: 'Good. Keep the address handy.', next: 'duration' },

        { id: 'evasive', label: "I'd rather not say",
          keys: ['rather not', 'confidential', 'nda', "can't say", 'cant say', 'private', 'secret'],
          reply: 'Confidential. Of course it is.', suspicion: 3, next: 'duration' }
      ],
      fallback: { reply: 'A name will do.', next: 'duration' }
    },

    /* ── stay ──────────────────────────────────────────────── */
    duration: {
      mood: 'neutral',
      ask: ['How long are you staying?'],
      intents: [
        { id: 'short', label: 'About a week',
          keys: ['week', 'day', 'days', 'weekend', 'short', 'brief', 'few'],
          set: { duration: 'about a week' }, reply: 'A week. Fine.', next: 'stay' },

        { id: 'long', label: 'A few months',
          keys: ['month', 'months', 'year', 'long', 'while', 'season'],
          set: { duration: 'a few months' },
          reply: "That's a long holiday. Return ticket?", suspicion: 2, next: 'stay' },

        { id: 'open', label: "I haven't decided",
          keys: ["haven't decided", 'havent decided', 'not sure', 'open', 'one way', 'one-way', 'depends', 'indefinite'],
          set: { duration: 'undecided' },
          reply: 'One-way and undecided. I do love a mystery.', suspicion: 3, next: 'stay' }
      ],
      fallback: { reply: 'A number, please.', suspicion: 1, next: 'stay' }
    },

    stay: {
      mood: 'neutral',
      ask: ['And where will you be staying?'],
      intents: [
        { id: 'hotel', label: 'A hotel downtown',
          keys: ['hotel', 'hostel', 'airbnb', 'apartment', 'rental', 'booked', 'reservation'],
          set: { stay: 'a hotel' }, reply: 'Booked in advance. Refreshing.', next: 'luggage' },

        { id: 'friends', label: 'With friends',
          keys: ['friend', 'family', 'cousin', 'relatives', 'someone i know', 'my brother', 'my sister'],
          set: { stay: 'with friends' }, reply: 'With friends. Address on the form, then.', next: 'luggage' },

        { id: 'nowhere', label: "I'll figure it out",
          keys: ['figure it out', 'no idea', "don't know", 'dont know', 'nowhere', 'wherever', 'car', 'not sure'],
          set: { stay: 'undecided' },
          reply: 'No address. You are making this interesting.', suspicion: 3, next: 'luggage' }
      ],
      fallback: { reply: 'An address, or the name of a hotel.', suspicion: 1, next: 'luggage' }
    },

    /* ── bags ──────────────────────────────────────────────── */
    luggage: {
      mood: 'stern',
      ask: ['Did you pack your bags yourself?'],
      intents: [
        { id: 'self', label: 'Yes, myself',
          keys: ['yes', 'myself', 'i did', 'me', 'own'],
          reply: 'Good.', next: 'declare' },

        { id: 'other', label: 'Someone helped me',
          keys: ['helped', 'someone', 'my partner', 'my mother', 'wife', 'husband', 'roommate', 'no'],
          reply: 'Someone else touched your bags. Remember that answer.',
          suspicion: 3, next: 'declare' },

        { id: 'favour', label: "I'm carrying something for a friend",
          keys: ['carrying', 'favour', 'favor', 'package', 'parcel', 'for a friend', 'deliver'],
          reply: 'A parcel. For a friend. You cannot possibly be serious.',
          suspicion: 5, mood: 'suspicious', next: 'declare' }
      ],
      fallback: { reply: "I'll take that as a yes.", next: 'declare' }
    },

    /* ── declaration ───────────────────────────────────────── */
    declare: {
      mood: 'stern',
      ask: ['Anything to declare? Food, plants, animal products,',
            'currency above ten thousand.'],
      intents: [
        { id: 'nothing', label: 'Nothing to declare',
          keys: ['nothing', 'no', 'none', 'nope', 'clean', 'empty'],
          set: { declare: 'nothing' }, reply: 'Nothing at all.', next: 'verdict' },

        { id: 'food', label: 'Some food from home',
          keys: ['food', 'cheese', 'meat', 'sausage', 'fruit', 'honey', 'chocolate', 'snack', 'sandwich', 'plant', 'seeds'],
          set: { declare: 'food' }, reply: 'Food. Show me.', suspicion: 1, next: 'probe_food' },

        { id: 'cash', label: 'Cash, a fair amount',
          keys: ['cash', 'money', 'currency', 'euro', 'dollar', 'notes', 'gold'],
          set: { declare: 'currency' }, reply: 'Currency. How much, exactly?', suspicion: 1, next: 'probe_cash' },

        { id: 'gift', label: 'Just souvenirs',
          keys: ['gift', 'souvenir', 'present', 'shopping', 'perfume', 'watch'],
          set: { declare: 'souvenirs' }, reply: 'Souvenirs. Keep the receipts.', next: 'verdict' },

        { id: 'contraband', label: 'A live parrot',
          keys: ['parrot', 'drugs', 'gun', 'weapon', 'knife', 'bomb', 'snake', 'lizard', 'animal', 'ivory'],
          set: { declare: 'something alarming' },
          reply: 'Say that again slowly, and think about it first.',
          suspicion: 7, mood: 'suspicious', next: 'verdict' }
      ],
      fallback: { reply: "That's a yes or a no.", suspicion: 1, keep: true },
      escape: 'verdict'
    },

    probe_food: {
      mood: 'neutral',
      ask: ['Is it sealed, commercially packaged?'],
      intents: [
        { id: 'sealed', label: 'Sealed, from a shop',
          keys: ['sealed', 'shop', 'packaged', 'store', 'yes', 'factory', 'wrapped'],
          reply: 'Then it stays with you.', next: 'verdict' },
        { id: 'homemade', label: "It's homemade",
          keys: ['homemade', 'home', 'grandma', 'mother', 'no', 'open', 'fresh', 'raw'],
          reply: 'Homemade. That goes in the bin on your left.', suspicion: 2, next: 'verdict' }
      ],
      fallback: { reply: 'We will look at it either way.', suspicion: 1, next: 'verdict' }
    },

    probe_cash: {
      mood: 'stern',
      ask: ['A number, please.'],
      intents: [
        { id: 'under', label: 'Under ten thousand',
          keys: ['under', 'less', 'thousand', 'hundred', 'small', 'few', 'below'],
          reply: 'Under the limit. Nothing to file.', next: 'verdict' },
        { id: 'over', label: 'More than ten thousand',
          keys: ['over', 'more', 'above', 'lot', 'million', 'fifty', 'twenty', 'hundred thousand'],
          reply: 'Then you fill out a form. A long one.', suspicion: 3, next: 'verdict' },
        { id: 'coy', label: "I'd rather not say",
          keys: ['rather not', "won't say", 'wont say', 'private', 'none of', 'secret'],
          reply: 'Declining to count it is itself an answer.', suspicion: 4, next: 'verdict' }
      ],
      fallback: { reply: 'I will assume it is more than you should carry.', suspicion: 2, next: 'verdict' }
    },

    /* ── verdict ───────────────────────────────────────────── */
    verdict: { final: true }
  };

  /* ── free-text matching ──────────────────────────────────── */

  function hits(text, key) {
    if (key.length <= 3) {
      return new RegExp(`\\b${key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`).test(text) ? key.length : 0;
    }
    return text.includes(key) ? key.length : 0;
  }

  // Best intent wins by total weight of matched keywords; ties go to
  // the intent declared first, which is why the safe answers lead.
  function match(node, text) {
    const t = ' ' + text.toLowerCase().trim() + ' ';
    let best = null, bestScore = 0;

    for (const intent of node.intents || []) {
      let score = 0;
      for (const key of intent.keys || []) score += hits(t, key);
      if (score > bestScore) { best = intent; bestScore = score; }
    }
    return best || Object.assign({ id: '_fallback', fallback: true }, node.fallback);
  }

  /* ── the ending ──────────────────────────────────────────── */

  function recap(facts) {
    const bits = [];
    if (facts.purpose)  bits.push(facts.purpose === 'unstated' ? 'purpose unstated' : facts.purpose);
    if (facts.duration) bits.push(facts.duration);
    if (facts.stay)     bits.push(facts.stay);
    if (facts.declare)  bits.push('declaring ' + facts.declare);
    return bits.join(', ');
  }

  function verdict(state) {
    const s = state.suspicion;
    const line = recap(state.facts);

    if (s <= 2) {
      return {
        approved: true, mood: 'friendly', label: 'ENTRY GRANTED',
        lines: [
          line ? `So: ${line}.` : 'So: nothing out of the ordinary.',
          'Everything checks out.',
          'Welcome. Enjoy your stay — and keep the passport dry.'
        ]
      };
    }
    if (s <= 6) {
      return {
        approved: true, mood: 'stern', label: 'ENTRY GRANTED — FLAGGED',
        lines: [
          line ? `So: ${line}.` : 'So: a great deal left unsaid.',
          'A few of your answers I did not care for.',
          "I'm letting you through. Your bags go through the scanner first.",
          'Welcome to the country. Behave.'
        ]
      };
    }
    return {
      approved: false, mood: 'suspicious', label: 'REFERRED TO SECONDARY',
      lines: [
        line ? `So: ${line}.` : 'So: nothing I can write down.',
        'No. I have heard enough.',
        'Take your documents and follow the red line to the room with no windows.',
        'Someone will be with you. Eventually.'
      ]
    };
  }

  return { NODES, match, verdict, start: 'greet' };
})();
</script>
<script>
/* ─────────────────────────────────────────────────────────────
   app.js — wires the script to the puppet, the voice and the panel.

   Turn order with voice on:
     officer speaks aloud  →  mic opens  →  you answer  →  repeat.
   Typing and the chips keep working at every point, and every
   voice failure falls back to them rather than dead-ending.
   ───────────────────────────────────────────────────────────── */

(() => {

  const log      = document.getElementById('log');
  const chips    = document.getElementById('chips');
  const form     = document.getElementById('form');
  const input    = document.getElementById('input');
  const mic      = document.getElementById('mic');
  const toggle   = document.getElementById('voice-toggle');
  const composer = document.querySelector('.composer');
  const hudDot   = document.getElementById('hud-dot');
  const hudText  = document.getElementById('hud-text');
  const gate     = document.getElementById('gate');
  const gateNote = document.getElementById('gate-note');

  const state = { suspicion: 0, facts: {}, node: null, strikes: 0, over: false };
  const voice = { out: false, in: false };   // speaking / listening enabled

  let interimEl = null;
  let misses = 0;

  /* ── panel plumbing ──────────────────────────────────────── */

  function scroll() { log.scrollTop = log.scrollHeight; }

  function bubble(kind, text = '') {
    const el = document.createElement('div');
    el.className = 'msg ' + kind;
    el.textContent = text;
    log.appendChild(el);
    scroll();
    return el;
  }

  function note(text, tone = '') { bubble('note ' + tone, text); }

  function hud(label, tone = '') {
    hudDot.className = 'hud-dot' + (tone ? ' ' + tone : '');
    hudText.textContent = 'BOOTH 4 · LANE B · ' + label;
  }

  function setBusy(on) {
    composer.classList.toggle('locked', on);
    if (on) hud('SPEAKING', 'busy');
    else if (!state.over) { hud('OPEN'); if (!voice.in) input.focus(); }
  }

  function setListening(on) {
    mic.classList.toggle('listening', on);
    mic.setAttribute('aria-pressed', String(on));
    if (on) hud('LISTENING', 'live');
    else if (!state.over && !composer.classList.contains('locked')) hud('OPEN');
  }

  // One line: spoken aloud if we have a voice, typed out if not.
  // Either way the same callback draws the caption and the same
  // three Officer calls drive the mouth.
  async function say(line) {
    const el = bubble('officer');
    el.classList.add('caret');
    const render = s => { el.textContent = s; scroll(); };

    let spoken = false;
    if (voice.out) {
      spoken = await Voice.speak(line, render);
      // A browser that claims speech support but never actually starts
      // would stall on every line. Ask once, then stop asking.
      if (!spoken) {
        voice.out = false;
        syncVoiceUI();
        note('NO VOICE AVAILABLE HERE — CAPTIONS ONLY');
      }
    }
    if (!spoken) await Officer.speak(line, render);

    el.classList.remove('caret');
    await Officer.pause(spoken ? 120 : 260);
  }

  function renderChips(intents) {
    chips.replaceChildren();
    for (const intent of intents) {
      if (!intent.label) continue;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = intent.label;
      b.addEventListener('click', () => answer(intent.label, intent));
      chips.appendChild(b);
    }
  }

  function showInterim(text) {
    if (!interimEl) interimEl = bubble('you interim');
    interimEl.textContent = text;
    scroll();
  }

  function clearInterim() {
    interimEl?.remove();
    interimEl = null;
  }

  /* ── the interview ───────────────────────────────────────── */

  async function enter(id, extraLines = []) {
    const node = Dialogue.NODES[id];
    state.node = node;
    state.strikes = 0;
    misses = 0;

    if (node.final) return finish();

    setBusy(true);
    if (node.mood) Officer.setMood(node.mood);

    for (const line of extraLines) await say(line);
    const asks = typeof node.ask === 'function' ? node.ask(state) : node.ask;
    for (const line of asks) await say(line);

    renderChips(node.intents || []);
    setBusy(false);
    openMic();
  }

  // Re-ask the current node without repeating the whole preamble.
  async function reask(extraLines) {
    const node = state.node;
    setBusy(true);
    for (const line of extraLines) await say(line);
    renderChips(node.intents || []);
    setBusy(false);
    openMic();
  }

  async function answer(shown, intent) {
    // No question on the table yet (the gate is still up, or he is
    // mid-sentence) — there is nothing to answer.
    if (!state.node || state.over || composer.classList.contains('locked')) return;

    Voice.stopListening();
    setListening(false);
    clearInterim();
    chips.replaceChildren();
    bubble('you', shown);
    setBusy(true);

    const node = state.node;
    const picked = intent || Dialogue.match(node, shown);

    state.suspicion += picked.suspicion || 0;
    Object.assign(state.facts, picked.set || {});
    if (picked.mood) Officer.setMood(picked.mood);

    await Officer.pause(300);

    const lines = picked.reply ? [picked.reply] : [];

    // Nobody gets to stonewall the same question forever.
    if (picked.keep) {
      state.strikes++;
      if (state.strikes >= 2 && node.escape) {
        state.suspicion += 1;
        return enter(node.escape, lines.concat(["We'll come back to that."]));
      }
      return reask(lines);
    }

    return enter(picked.next || 'verdict', lines);
  }

  /* ── the microphone ──────────────────────────────────────── */

  async function openMic() {
    if (!voice.in || state.over || Voice.listening) return;

    setListening(true);
    const heard = await Voice.listen(showInterim);
    setListening(false);

    if (state.over || !voice.in) return clearInterim();

    if (heard.transcript) {
      clearInterim();
      return answer(heard.transcript, null);
    }

    switch (heard.error) {
      case 'aborted':
        // Ours, or the browser refusing to run recognition at all.
        if (heard.intentional) return clearInterim();
        return dropVoiceInput('MICROPHONE UNAVAILABLE — TYPE YOUR ANSWER INSTEAD');

      case 'not-allowed':
      case 'service-not-allowed':
      case 'unsupported':
      case 'start-failed':
        return dropVoiceInput('MICROPHONE UNAVAILABLE — TYPE YOUR ANSWER INSTEAD');

      case 'network':
        return dropVoiceInput('SPEECH SERVICE UNREACHABLE — TYPE YOUR ANSWER INSTEAD');

      default:                               // no-speech, and anything else
        clearInterim();
        if (++misses >= 2) {
          note('NO ANSWER HEARD — TYPE IT, OR TAP THE MICROPHONE');
          input.focus();
          return;
        }
        setBusy(true);
        await say(misses === 1 ? "I didn't catch that." : 'Speak up, please.');
        setBusy(false);
        return openMic();
    }
  }

  function dropVoiceInput(message) {
    voice.in = false;
    clearInterim();
    setListening(false);
    mic.hidden = true;
    note(message);
    input.focus();
  }

  mic.addEventListener('click', () => {
    if (Voice.listening) { Voice.stopListening(); setListening(false); clearInterim(); }
    else if (!composer.classList.contains('locked')) { voice.in = true; openMic(); }
  });

  toggle.addEventListener('click', () => {
    const on = toggle.getAttribute('aria-pressed') !== 'true';
    setVoice(on, on && Voice.support.listen && voice.allowedIn);
    if (!on) { Voice.shutUp(); Voice.stopListening(); setListening(false); clearInterim(); }
    else openMic();
  });

  function syncVoiceUI() {
    const on = voice.out || voice.in;
    toggle.hidden = !(Voice.support.speak || Voice.support.listen);
    toggle.setAttribute('aria-pressed', String(on));
    toggle.textContent = on ? 'VOICE ON' : 'VOICE OFF';
    mic.hidden = !voice.in;
    if (!state.over) input.placeholder = voice.in ? '…or type it' : 'Say something…';
  }

  function setVoice(out, listen) {
    voice.out = out && Voice.support.speak;
    voice.in  = !!listen;
    syncVoiceUI();
  }

  /* ── ending ──────────────────────────────────────────────── */

  async function finish() {
    state.over = true;
    setBusy(true);
    chips.replaceChildren();
    Voice.stopListening();
    setListening(false);

    const result = Dialogue.verdict(state);
    Officer.setMood(result.mood);

    for (const line of result.lines) await say(line);

    Officer.lookAt('passport');
    await Officer.pause(320);
    await Officer.stamp(result.approved);

    note(result.label, result.approved ? 'pass' : 'fail');
    note(`flags raised · ${state.suspicion}`);
    hud(result.approved ? 'CLEARED' : 'HOLD', result.approved ? '' : 'closed');

    const again = document.createElement('button');
    again.type = 'button';
    again.className = 'chip primary';
    again.textContent = 'Next traveller';
    again.addEventListener('click', restart);
    chips.appendChild(again);

    composer.classList.remove('locked');
    input.disabled = true;
    input.placeholder = 'The counter is closed.';
    mic.disabled = true;
  }

  function restart() {
    Voice.shutUp();
    Voice.stopListening();
    state.suspicion = 0;
    state.facts = {};
    state.over = false;
    log.replaceChildren();
    chips.replaceChildren();
    clearInterim();
    input.disabled = false;
    input.placeholder = 'Say something…';
    mic.disabled = false;
    Officer.reset();
    enter(Dialogue.start);
  }

  /* ── input ───────────────────────────────────────────────── */

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    // If he is still talking, keep what you typed rather than eating it.
    if (!text || state.over || composer.classList.contains('locked')) return;
    input.value = '';
    answer(text, null);
  });

  input.addEventListener('focus', () => {
    if (Voice.listening) { Voice.stopListening(); setListening(false); clearInterim(); }
  });

  /* ── the gate ────────────────────────────────────────────── */

  async function begin(withVoice) {
    const start = document.getElementById('gate-start');
    if (withVoice) {
      start.disabled = true;
      start.textContent = 'One moment…';
      const got = await Voice.unlock();
      voice.allowedIn = got.listen;
      setVoice(got.speak, got.listen);
      if (!got.listen && got.reason) gateNote.textContent = got.reason;
      if (!got.listen && got.reason) await new Promise(r => setTimeout(r, 1800));
    } else {
      voice.allowedIn = false;
      setVoice(false, false);
    }

    gate.classList.add('open');
    setTimeout(() => { gate.hidden = true; }, 400);
    enter(Dialogue.start);
  }

  document.getElementById('gate-start').addEventListener('click', () => begin(true));
  document.getElementById('gate-silent').addEventListener('click', () => begin(false));

  if (!Voice.support.speak && !Voice.support.listen) {
    gateNote.textContent = 'This browser has no speech support — the interview will be typed.';
  } else if (location.protocol === 'file:') {
    gateNote.textContent = 'Opened from a file — if the microphone is refused, serve the page over http://localhost.';
  }

  // Nothing is accepted until the gate is cleared and a question is up.
  composer.classList.add('locked');
  Officer.init();
})();
</script>
</body>
