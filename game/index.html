<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4CAF50">
  <title>Mini Farm</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="logo">Mini Farm</div>
    <div class="loading-bar-container">
      <div class="loading-bar"></div>
    </div>
    <div class="loading-tip">Loading your farm...</div>
    <div class="loading-scenery">
      <span>🌳</span><span>🏠</span><span>🌾</span><span>🐄</span><span>🌻</span><span>🌳</span>
    </div>
  </div>

  <!-- Game Container -->
  <div id="game-container">
    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <!-- Top Display Bar (thin, display-only) -->
      <div class="hud-top-bar">
        <div class="hud-player-info">
          <div class="hud-avatar" id="hud-avatar-btn">
            <span id="hud-avatar">&#x1F468;&#x200D;&#x1F33E;</span>
          </div>
          <span class="hud-level-badge" id="hud-level">Lv.1</span>
        </div>

        <div class="hud-xp-container">
          <div class="hud-xp-bar-outer">
            <div class="hud-xp-bar-inner" id="hud-xp-bar" style="width: 0%"></div>
            <div class="hud-xp-text" id="hud-xp-text">0 / 50</div>
          </div>
        </div>

        <div class="hud-currencies">
          <div class="hud-currency coins">
            <span class="icon">&#x1FA99;</span>
            <span id="hud-coins">100</span>
            <span class="hud-cps" id="hud-cps">0/s</span>
          </div>
          <div class="hud-currency gems">
            <span class="icon">&#x1F48E;</span>
            <span id="hud-gems">5</span>
          </div>
          <div class="energy-bar">
            <span class="icon">&#x26A1;</span>
            <span id="hud-energy">20/20</span>
          </div>
        </div>
      </div>

      <!-- Context Action Bar (dynamic, above bottom nav) -->
      <div class="context-bar" id="context-bar">
        <div class="context-bar-content" id="context-bar-content">
          <!-- Farm tools (default) -->
          <button class="ctx-btn active" data-tool="select" title="Select">
            &#x1F446;
            <span>Select</span>
          </button>
          <button class="ctx-btn" data-tool="plant" title="Plant">
            &#x1F331;
            <span>Plant</span>
          </button>
          <button class="ctx-btn" data-tool="harvest-all" title="Harvest All">
            &#x1F33E;
            <span>Harvest</span>
          </button>
          <button class="ctx-btn" data-tool="plant-all" title="Fill All">
            &#x1F33B;
            <span>Fill All</span>
          </button>
          <button class="ctx-btn" data-tool="build" title="Build">
            &#x1F3D7;&#xFE0F;
            <span>Build</span>
          </button>
        </div>
      </div>

      <!-- FAB (Floating Action Button) -->
      <button class="fab" id="fab-btn" title="Quick Action">
        &#x1F33E;
      </button>

      <!-- Bottom Navigation Bar (6 tabs) -->
      <div class="bottom-nav" id="bottom-nav">
        <button class="nav-tab active" data-nav="farm" title="Farm">
          <span class="nav-icon">&#x1F33E;</span>
          <span class="nav-label">Farm</span>
        </button>
        <button class="nav-tab" data-nav="quests" title="Quests">
          <span class="nav-icon">&#x1F4DC;</span>
          <span class="nav-label">Quests</span>
          <span class="nav-badge" id="quest-badge" style="display:none">0</span>
        </button>
        <button class="nav-tab" data-nav="shop" title="Shop">
          <span class="nav-icon">&#x1F6D2;</span>
          <span class="nav-label">Shop</span>
        </button>
        <button class="nav-tab" data-nav="battle" title="Battle">
          <span class="nav-icon">&#x2694;&#xFE0F;</span>
          <span class="nav-label">Battle</span>
        </button>
        <button class="nav-tab" data-nav="social" title="Social">
          <span class="nav-icon">&#x1F3F0;</span>
          <span class="nav-label">Social</span>
          <span class="nav-badge" id="guild-badge" style="display:none"></span>
        </button>
        <button class="nav-tab" data-nav="more" title="More">
          <span class="nav-icon">&#x2022;&#x2022;&#x2022;</span>
          <span class="nav-label">More</span>
        </button>
      </div>

      <!-- More Menu (overflow) -->
      <div class="more-menu" id="more-menu" style="display:none">
        <button class="more-item" id="btn-inventory">
          <span class="more-icon">&#x1F3DA;&#xFE0F;</span>
          <span>Barn</span>
        </button>
        <button class="more-item" id="btn-orders">
          <span class="more-icon">&#x1F4E6;</span>
          <span>Orders</span>
          <span class="more-badge" id="orders-badge" style="display:none">0</span>
        </button>
        <button class="more-item" id="btn-achievements">
          <span class="more-icon">&#x1F3C6;</span>
          <span>Achievements</span>
        </button>
        <button class="more-item" id="btn-collections">
          <span class="more-icon">&#x1F4DA;</span>
          <span>Collections</span>
        </button>
        <button class="more-item" id="btn-settings">
          <span class="more-icon">&#x2699;&#xFE0F;</span>
          <span>Settings</span>
        </button>
      </div>

      <!-- Tile Info Tooltip -->
      <div id="tile-tooltip"></div>
    </div>

    <!-- Idle Tycoon HUD Overlays -->
    <div id="hud-combo" class="hud-combo" style="display:none">0x</div>
    <div id="hud-combo-mult" class="hud-combo-mult" style="display:none">x1</div>
    <div id="hud-frenzy" class="hud-frenzy" style="display:none">
      <span class="frenzy-icon">&#x1F525;</span>
      <span class="frenzy-text">x1</span>
    </div>

    <!-- Guild & Competition HUD -->
    <div id="hud-raid" class="hud-raid" style="display:none"></div>
    <div id="hud-tournament" class="hud-tournament" style="display:none"></div>
    <div id="hud-challenge" class="hud-challenge" style="display:none"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Panel Overlay -->
    <div id="panel-overlay" class="panel-overlay"></div>
  </div>

  <!-- Data Files -->
  <script src="js/data/crops.js"></script>
  <script src="js/data/animals.js"></script>
  <script src="js/data/buildings.js"></script>
  <script src="js/data/trees.js"></script>
  <script src="js/data/decorations_data.js"></script>
  <script src="js/data/quests.js"></script>
  <script src="js/data/levels.js"></script>
  <script src="js/data/achievements.js"></script>
  <script src="js/data/orders.js"></script>
  <script src="js/data/guilds.js"></script>
  <script src="js/data/managers.js"></script>
  <script src="js/data/research.js"></script>
  <script src="js/data/collections_data.js"></script>

  <!-- Core -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/renderer.js"></script>
  <script src="js/core/state.js"></script>

  <!-- Systems -->
  <script src="js/systems/orders.js"></script>
  <script src="js/systems/achievements.js"></script>
  <script src="js/systems/guild.js"></script>
  <script src="js/systems/competition.js"></script>

  <!-- UI -->
  <script src="js/ui/notifications.js"></script>
  <script src="js/ui/panels.js"></script>

  <!-- Main Game -->
  <script src="js/core/game.js"></script>
</body>
</html>
